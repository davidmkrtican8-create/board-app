<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="УчиДоска">
<title>Мой кабинет</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* оформление в стиле главной: тетрадь в клетку */
:root{--bg:#f7f4ec;--panel:#fffdf8;--tx:#1b2233;--mut:#566074;--ac:#2547b0;--bd:#e4dfd2;--cell:#e6ebf1;--ok:#2f7d4f;--bad:#d33a2c;--warn:#b07a12;--soft:color-mix(in srgb,var(--ac) 9%,transparent);--track:#ece7da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18211d;--panel:#1f2a25;--tx:#eef1e8;--mut:#a8b4ab;--ac:#9db8ff;--bd:#304039;--cell:#2a3832;--ok:#6fcf97;--bad:#ff8a7a;--warn:#f2c14e;--track:#2c3a33}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--cell) 1px,transparent 1px),linear-gradient(90deg,var(--cell) 1px,transparent 1px);background-size:22px 22px;color:var(--tx);font:16px/1.45 Onest,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button{cursor:pointer;font-weight:600}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#10162a}}
a{color:var(--ac)}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 60px}
.mut{color:var(--mut)}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ava{width:50px;height:50px;flex:none;border-radius:14px;background:var(--ac);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
header h1{font-size:26px;line-height:1.15;letter-spacing:-.5px;margin:0;font-weight:800}
header .sub{font-size:13px;color:var(--mut)}
header .hd{flex:1;min-width:0}
.grp{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--bd);border-left:5px solid #6a3fc4;border-radius:14px;padding:12px 14px;margin:12px 0 0;text-decoration:none;color:var(--tx);box-shadow:0 2px 0 var(--bd)}.grp b{display:block}.grp span{font-size:13px;color:var(--mut)}.grp .go{margin-left:auto;font-size:26px;color:var(--mut)}
.streak{margin:14px 0 4px;background:linear-gradient(135deg,#ff8a3d,#ff4f8b);color:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px rgba(255,79,139,.22)}
.streak .f{font-size:36px;line-height:1}.streak b{font-size:18px;display:block;line-height:1.25}.streak span{font-size:13px;opacity:.92}
.days{display:flex;gap:5px;margin-top:7px}.days i{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.3);font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}.days i.y{background:#fff;color:#ff5a6e}
h2{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:24px 0 10px;display:flex;align-items:baseline;gap:8px}h2 small{font-size:13px;font-weight:500;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;position:relative;box-shadow:0 2px 0 var(--bd)}
.card.new{border-left-color:#e8796f}.card.late{border-left-color:var(--bad)}.card.sent{border-left-color:#e0a526}.card.checked{border-left-color:var(--ok)}
.card .t{flex:1;min-width:0}.card .t b{display:block;font-size:16px}.card .t span{font-size:13px;color:var(--mut)}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--soft);white-space:nowrap}
.chip.new{background:color-mix(in srgb,#e8796f 16%,transparent);color:#c0503f}
.chip.late{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.sent{background:color-mix(in srgb,#e0a526 18%,transparent);color:var(--warn)}
.chip.checked{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.score{font-weight:800;font-size:20px;color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent);border-radius:10px;padding:3px 10px;white-space:nowrap}
.go{font-size:26px;color:var(--mut);line-height:1;margin-left:-4px}
.stamp{position:absolute;right:14px;top:-9px;background:var(--ok);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1;color:var(--ac);letter-spacing:-.5px}.stat span{font-size:12px;color:var(--mut)}
.box{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 0 var(--bd)}
.tg{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;margin-top:10px}.tg .t{flex:1;min-width:200px}.tg a{text-decoration:none}
.empty{color:var(--mut);background:var(--panel);border:1px dashed var(--bd);border-radius:14px;padding:18px;text-align:center}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}.bar .n{width:40px;font-weight:700}
.bar .tr{flex:1;height:12px;border-radius:7px;background:var(--track);overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:7px}
.bar .v{width:76px;text-align:right;color:var(--mut)}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
.rep{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring i{width:48px;height:48px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;font-style:normal}
.badges{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.bd{flex:none;width:86px;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center;font-size:11px;color:var(--mut);line-height:1.3}
.bd div{font-size:28px;margin-bottom:4px}.bd.off{opacity:.38;filter:grayscale(1)}
.boards{display:flex;gap:8px;flex-wrap:wrap}.boards a{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--tx);font-size:14px}
/* открытая домашка */
#hw[hidden],#home[hidden]{display:none}
#hw header h1{font-size:22px}
.back{margin-bottom:12px}
.task{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 0 var(--bd)}
.task .hd{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.task .hd b{flex:1}
.task img{display:block;max-width:100%;border-radius:8px;background:#fff;margin:6px 0}
.task .txt{white-space:pre-wrap;margin:6px 0}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.ans input{width:170px}
.res{font-weight:700}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.actions.top{margin:6px 0 14px}.actions.top button{padding:12px 16px;font-size:16px;border-radius:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.ph{position:relative}.ph img{width:120px;height:150px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);display:block;cursor:zoom-in}
.ph button{position:absolute;top:4px;right:4px;padding:0 8px;font-size:14px;border-radius:20px}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;margin:12px 0;white-space:pre-wrap}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9;padding:10px}
#zoom[hidden]{display:none}#zoom img{max-width:100%;max-height:100%}
#st{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#st.on{opacity:.92}
@media (max-width:420px){header .open span{display:none}}
</style>
</head>
<body>
<div class="wrap">
 <div id="home">
  <header><div class="ava" id="ava">?</div><div class="hd"><h1 id="hi">Мой кабинет</h1><div class="sub" id="tch"></div></div><a id="toBoard" class="open" href="#"><button class="pri">✏️<span> Доска</span></button></a></header>
  <div id="grps"></div>
  <div id="streak"></div>
  <h2>Домашка <small id="hwc"></small></h2><div id="list"></div>
  <h2>Прогресс</h2>
  <div class="stats">
   <div class="stat"><b id="s1">–</b><span>домашек сдано</span></div>
   <div class="stat"><b id="s2">–</b><span>верных решений</span></div>
   <div class="stat"><b id="s3">–</b><span>досок с уроков</span></div>
  </div>
  <div id="prog"></div>
  <h2>Награды</h2><div class="badges" id="badges"></div>
  <h2>Доски с уроков</h2><div class="boards" id="boards"></div>
  <div id="tgc"></div>
 </div>
 <div id="hw" hidden></div>
</div>
<div id="zoom" hidden><img alt=""></div>
<div id="st"></div>
<input type="file" id="pf" accept="image/*" multiple hidden>
<script>
(function(){
const $=i=>document.getElementById(i),sid=location.pathname.split('/').pop();
let D=null,open=null,saveT=null;
const el=(tag,props,...kids)=>{const e=Object.assign(document.createElement(tag),props||{});kids.forEach(k=>k!=null&&e.append(k));return e};
const toast=(t,ms)=>{const s=$('st');s.textContent=t;s.classList.add('on');clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove('on'),ms||2200)};
const img=n=>'/hwimg/'+sid+'/'+n;
const day=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const late=h=>h.st==='new'&&h.due&&Date.now()>h.due+864e5;
async function call(o){
 const r=await fetch('/api/'+sid+'/hw',o?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}:{});
 const j=r.ok?await r.json().catch(()=>null):null;
 if(!j){toast('Нет связи с сервером, попробуйте ещё раз',3500);return null}
 if(j.error){toast(j.error,3500);return null}
 D=j;return j;
}
// оценка задачи: оценка преподавателя важнее автопроверки
const mark=(h,t)=>h.marks[t.id]!==undefined?h.marks[t.id]:h.auto[t.id];
// серия: сколько последних домашек подряд сдано вовремя (просроченная или несданная в срок обрывает серию)
function streak(){
 const L=D.list.slice().sort((a,b)=>b.created-a.created);let n=0;
 for(const h of L){if(h.st==='new'){if(late(h))break;continue}if(h.due&&h.sentAt>h.due+864e5)break;n++}
 return n;
}
function stats(){
 const L=D.list,done=L.filter(h=>h.st!=='new').length;let ok=0,all=0;const by={};
 L.forEach(h=>{if(h.st==='new')return;h.tasks.forEach(t=>{const m=mark(h,t);if(m===undefined)return;all++;ok+=m;
  if(t.num){const b=by[t.num]=by[t.num]||{ok:0,all:0};b.all++;b.ok+=m}})});
 $('s1').textContent=done;$('s2').textContent=all?Math.round(ok/all*100)+'%':'–';$('s3').textContent=D.pages.length;
 const p=$('prog');p.innerHTML='';
 const ks=Object.keys(by).map(Number).sort((a,b)=>a-b);
 if(ks.length){const bx=el('div',{className:'box'});
  ks.forEach(k=>{const b=by[k],v=Math.round(b.ok/b.all*100),c=v>=75?'var(--ok)':v>=45?'#e0a526':'var(--bad)';
   const i=el('i');i.style.width=Math.max(3,v)+'%';i.style.background=c;
   bx.append(el('div',{className:'bar'},el('span',{className:'n',textContent:'№'+k}),el('div',{className:'tr'},i),el('span',{className:'v',textContent:v+'% · '+b.ok+'/'+b.all})))});
  const weak=ks.filter(k=>by[k].all>=2).sort((a,b)=>by[a].ok/by[a].all-by[b].ok/by[b].all)[0];
  if(weak&&by[weak].ok/by[weak].all<.6)bx.append(el('div',{className:'hint',textContent:'💡 Пока сложнее всего даётся №'+weak+'. Преподаватель это видит и даст ещё таких задач.'}));
  p.append(bx)}
 else p.append(el('div',{className:'empty',textContent:'Здесь появятся проценты по каждому номеру, когда преподаватель проверит первые задачи'}));
 const R=D.rep||{};
 if(R.fixed||R.left){const tot=R.fixed+R.left,pc=Math.round(R.fixed/tot*100),ring=el('div',{className:'ring'},el('i',{textContent:R.fixed+'/'+tot}));
  ring.style.background='conic-gradient(var(--ok) 0 '+pc+'%,var(--track) '+pc+'% 100%)';
  p.append(el('div',{className:'box rep'},ring,el('div',null,el('b',{textContent:'🔁 Работа над ошибками'}),
   el('div',{className:'hint',style:'margin-top:2px',textContent:'Исправлено '+R.fixed+' '+plural(R.fixed,'ошибка','ошибки','ошибок')+' из '+tot+'.'+(R.left?' Ещё '+R.left+(R.left===1?' вернётся':' вернутся')+' в следующих домашках.':' Все ошибки исправлены! 🎉')}))))}
 // награды
 const st=streak(),perfect=L.some(h=>{if(h.st!=='checked'||h.tasks.length<3)return false;const ms=h.tasks.map(t=>mark(h,t)).filter(m=>m!==undefined);return ms.length>=3&&ms.every(Boolean)});
 const B=[['🔥','5 домашек подряд вовремя',st>=5],['🎯','Домашка без единой ошибки',perfect],['🔁','10 ошибок исправлено',(R.fixed||0)>=10],['🚀','20 домашек сдано',done>=20],['👑','90% верных (от 30 задач)',all>=30&&ok/all>=.9]];
 const bg=$('badges');bg.innerHTML='';B.forEach(b=>bg.append(el('div',{className:'bd'+(b[2]?'':' off'),title:b[2]?'Получено!':'Пока не получено'},el('div',{textContent:b[0]}),b[1])));
 // серия
 const sk=$('streak');sk.innerHTML='';const pend=L.some(h=>h.st==='new'&&!late(h));
 if(st>=2){const ds=el('div',{className:'days'});for(let k=0;k<Math.min(st,7);k++)ds.append(el('i',{className:'y',textContent:'✓'}));if(pend)ds.append(el('i',{textContent:'?'}));
  sk.append(el('div',{className:'streak'},el('div',{className:'f',textContent:'🔥'}),el('div',null,el('b',{textContent:st+' '+plural(st,'домашка','домашки','домашек')+' подряд вовремя'}),
   el('span',{textContent:pend?'Сдай следующую в срок — серия продолжится':'Так держать!'}),ds)))}
}
function chip(h){
 if(h.st==='checked'){const ms=h.tasks.map(t=>mark(h,t)).filter(m=>m!==undefined);return ms.length?el('span',{className:'score',title:'Верно '+ms.filter(Boolean).length+' из '+ms.length,textContent:ms.filter(Boolean).length+'/'+ms.length}):el('span',{className:'chip checked',textContent:'Проверено'})}
 if(h.st==='sent')return el('span',{className:'chip sent',textContent:'⏳ проверяется'});
 if(late(h))return el('span',{className:'chip late',textContent:'Просрочено'});
 return el('span',{className:'chip new',textContent:h.due?'Сдать до '+day(h.due):'Не сдано'});
}
function home(){
 $('hw').hidden=true;$('home').hidden=false;open=null;
 $('hi').textContent='Привет, '+String(D.name).split(/\s+/)[0]+'!';$('ava').textContent=(String(D.name).trim()[0]||'?').toUpperCase();$('tch').textContent=D.teacher?'Преподаватель: '+D.teacher:'';document.title=D.name+' — кабинет';
 $('toBoard').href=(D.groups||[]).length?'/b/'+D.groups[0].id+'?u='+sid:'/b/'+sid; // ученик из группы — на доску группы
 const gp=$('grps');gp.innerHTML='';(D.groups||[]).forEach(g=>gp.append(el('a',{className:'grp',href:'/b/'+g.id+'?u='+sid},el('div',{textContent:'👥',style:'font-size:26px'}),el('div',null,el('b',{textContent:g.name}),el('span',{textContent:'Общая доска группы'})),el('span',{className:'go',textContent:'›'}))));
 const l=$('list');l.innerHTML='';
 if(!D.list.length)l.append(el('div',{className:'empty',textContent:'Домашних заданий пока нет 🎉'}));
 const order=h=>h.st==='new'?0:h.st==='sent'?1:2;
 D.list.slice().sort((a,b)=>order(a)-order(b)).forEach(h=>{
  const btn=h.st==='new'?el('button',{className:'pri',textContent:'Решать',onclick:()=>show(h.id)}):el('span',{className:'go',textContent:'›'});
  const ms=h.tasks.map(t=>mark(h,t)).filter(m=>m!==undefined),great=h.st==='checked'&&ms.length>=2&&ms.filter(Boolean).length/ms.length>=.85;
  const sub=h.st==='new'?(h.due?'сдать до '+day(h.due):'задано '+day(h.created)):h.st==='sent'?'на проверке у преподавателя':'проверено'+(h.checkedAt?' '+day(h.checkedAt):'');
  const c=el('div',{className:'card '+(late(h)?'late':h.st)},el('div',{className:'t'},el('b',{textContent:h.title}),el('span',{textContent:h.tasks.length+' '+plural(h.tasks.length,'задача','задачи','задач')+' · '+sub})),h.st==='new'&&!late(h)?null:chip(h),btn);
  if(h.st!=='new'){c.onclick=()=>show(h.id);c.style.cursor='pointer'}
  if(great)c.append(el('span',{className:'stamp',textContent:'отлично!'}));
  l.append(c);
 });
 const nn=D.list.filter(h=>h.st==='new').length;$('hwc').textContent=nn?nn+' '+plural(nn,'ждёт','ждут','ждут')+' решения':'';
 const bs=$('boards');bs.innerHTML='';
 D.pages.slice().reverse().forEach(p=>bs.append(el('a',{href:'/b/'+sid+'?own=1#p='+p.id,textContent:p.title||'Доска'})));
 stats();tgCard();
}
function tgCard(){
 const c=$('tgc');c.innerHTML='';if(!D.tg)return;
 const cp=el('button',{textContent:'Ссылка для родителей',title:'Скопировать ссылку: родители будут получать новости об уроках и домашках',onclick:()=>{(navigator.clipboard?navigator.clipboard.writeText(D.tg.p):Promise.reject()).then(()=>toast('Ссылка скопирована — отправьте её родителям'),()=>prompt('Ссылка для родителей:',D.tg.p))}});
 c.append(el('div',{className:'tg'},el('div',{className:'t',textContent:D.tg.on?'🔔 Telegram подключён: домашки и напоминания приходят туда.':'🔔 Получайте домашку, напоминания о сроках и оценки в Telegram'}),
  D.tg.on?null:el('a',{href:D.tg.s,target:'_blank',rel:'noopener'},el('button',{className:'pri',textContent:'Подключить'})),cp));
}
const plural=(n,a,b,c)=>{n%=100;if(n>10&&n<20)return c;n%=10;return n===1?a:n>1&&n<5?b:c};
function solveBtns(h,edit,top){ // «Решать на доске» и «Добавить фото тетради»
 const acts=el('div',{className:'actions'+(top?' top':'')});
 acts.append(el('button',{className:edit?'pri':'',textContent:(h.board?'✏️ Открыть доску с решением':'✏️ Решать на доске'),onclick:async()=>{
  if(h.board){location.href='/b/'+sid+'?own=1#p='+h.board;return}
  toast('Готовлю доску…');await flush();const j=await call({t:'board',id:h.id});if(!j)return;
  const n=j.list.find(x=>x.id===h.id);if(n&&n.board)location.href='/b/'+sid+'?own=1#p='+n.board}}));
 if(edit)acts.append(el('button',{textContent:'📷 Добавить фото тетради',onclick:()=>$('pf').click()}));
 return acts}
function show(id){
 const h=D.list.find(x=>x.id===id);if(!h)return home();open=id;
 $('home').hidden=true;const w=$('hw');w.hidden=false;w.innerHTML='';
 const edit=h.st==='new';
 w.append(el('button',{className:'back',textContent:'← Назад',onclick:()=>{flush();home()}}));
 w.append(el('header',null,el('h1',{textContent:h.title}),chip(h)));
 if(h.st==='checked'&&h.comment)w.append(el('div',{className:'note',textContent:'💬 Преподаватель: '+h.comment}));
 if(edit&&h.comment)w.append(el('div',{className:'note',textContent:'💬 Вернули на доработку: '+h.comment}));
 w.append(solveBtns(h,edit,true)); // те же кнопки сразу наверху — чтобы бросались в глаза
 if(edit)w.append(el('p',{className:'mut',textContent:'Короткие ответы впишите в поля. Решение обязательно: на доске или фото тетради. Когда всё готово, нажмите «Сдать на проверку».'}));
 h.tasks.forEach((t,i)=>{
  const c=el('div',{className:'task'});
  c.append(el('div',{className:'hd'},el('b',{textContent:'Задача '+(i+1)}),t.num?el('span',{className:'chip',textContent:'№'+t.num}):null,t.rep?el('span',{className:'chip',title:'Эту задачу вы раньше решили неверно — попробуйте ещё раз',textContent:'🔁 работа над ошибками'}):null));
  if(t.text)c.append(el('div',{className:'txt',textContent:t.text}));
  if(t.img){const im=el('img',{src:img(t.img),alt:'Условие задачи',loading:'lazy'});im.onclick=()=>zoom(im.src);c.append(im)}
  const m=mark(h,t);
  if(t.short){
   const inp=el('input',{value:h.answers[t.id]||'',placeholder:'Ваш ответ',disabled:!edit,inputMode:'decimal',autocomplete:'off'});
   inp.dataset.t=t.id;inp.oninput=()=>{clearTimeout(saveT);saveT=setTimeout(flush,900)};
   const a=el('div',{className:'ans'},el('span',{textContent:'Ответ:'}),inp);
   if(m!==undefined)a.append(el('span',{className:'res '+(m?'ok':'bad'),textContent:m?'✓ верно':'✗ неверно'}));
   if(t.ans!==undefined&&!m)a.append(el('span',{className:'mut',textContent:'правильный: '+t.ans}));
   c.append(a);
  }else if(m!==undefined)c.append(el('div',{className:'ans'},el('span',{className:'res '+(m?'ok':'bad'),textContent:m?'✓ решено верно':'✗ есть ошибки'})));
  w.append(c);
 });
 // решение: доска и фото
 w.append(el('h2',{textContent:'Решение'}));
 w.append(solveBtns(h,edit));
 const ph=el('div',{className:'photos'});
 h.photos.forEach(n=>{const im=el('img',{src:img(n),alt:'Фото решения'});im.onclick=()=>zoom(im.src);
  const box=el('div',{className:'ph'},im);
  if(edit)box.append(el('button',{textContent:'✕',title:'Убрать фото',onclick:async()=>{if(confirm('Убрать это фото?')&&await call({t:'photo-del',id:h.id,name:n}))show(h.id)}}));
  ph.append(box)});
 if(h.photos.length)w.append(ph);
 if(edit)w.append(el('div',{className:'actions'},el('button',{className:'pri',textContent:'Сдать на проверку',onclick:submit})));
 else if(h.st==='sent')w.append(el('p',{className:'mut',textContent:'Сдано '+day(h.sentAt)+'. Преподаватель проверит и поставит оценки.'}));
 scrollTo(0,0);
}
function answers(){const a={};document.querySelectorAll('#hw input[data-t]').forEach(i=>{if(i.value.trim())a[i.dataset.t]=i.value.trim()});return a}
async function flush(){
 clearTimeout(saveT);if(!open)return;const h=D.list.find(x=>x.id===open);if(!h||h.st!=='new')return;
 const a=answers();if(JSON.stringify(a)===JSON.stringify(h.answers))return;
 if(await call({t:'answers',id:open,answers:a}))toast('Ответы сохранены',1200);
}
async function submit(){
 const h=D.list.find(x=>x.id===open);if(!h)return;
 if(!h.photos.length&&!h.board){alert('Чтобы сдать домашку, прикрепите фото решения из тетради («📷 Добавить фото тетради») или решите задачи на доске («Решать на доске»).');return}
 const a=answers(),empty=h.tasks.filter(t=>t.short&&!a[t.id]).length;
 if(!confirm((empty?'Не заполнено ответов: '+empty+'. ':'')+'Сдать домашку? После этого изменить ответы будет нельзя.'))return;
 await flush();if(await call({t:'submit',id:h.id})){toast('Сдано! 👍');show(h.id)}
}
// фото тетради: уменьшаем на телефоне до ~1600 px, чтобы грузилось быстро и не занимало место
function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};
 im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
$('pf').onchange=async()=>{const fl=[...$('pf').files];$('pf').value='';if(!fl.length||!open)return;
 const id=open;for(const f of fl){toast('Загружаю фото…',20000);let s;try{s=await shrink(f)}catch(e){toast('Это фото не открылось. Попробуйте сделать снимок ещё раз.',4000);continue}
  if(!await call({t:'photo',id,src:s}))break}
 toast('Фото добавлено',1500);show(id)};
function zoom(src){$('zoom').querySelector('img').src=src;$('zoom').hidden=false}
$('zoom').onclick=()=>{$('zoom').hidden=true};
addEventListener('pagehide',()=>{if(open){const a=answers();navigator.sendBeacon&&navigator.sendBeacon('/api/'+sid+'/hw',new Blob([JSON.stringify({t:'answers',id:open,answers:a})],{type:'application/json'}))}});
call().then(j=>{if(!j){document.querySelector('.wrap').innerHTML='<div class="empty">Не получилось открыть кабинет. Обновите страницу.</div>';return}
 const q=new URLSearchParams(location.search).get('hw');if(q&&j.list.some(h=>h.id===q))show(q);else home()});
})();
</script>
