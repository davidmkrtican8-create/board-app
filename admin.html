<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="УчиДоска">
<title>Кабинет преподавателя</title>
<style>
:root{--bg:#f4f1fa;--panel:#fff;--tx:#201c2b;--mut:#6b6580;--ac:#6a3fc4;--bd:#ddd6ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--panel:#221e2e;--tx:#ece8f5;--mut:#9a93b0;--ac:#a98bf0;--bd:#3a3450}}
:root[data-theme="dark"]{--bg:#17141f;--panel:#221e2e;--tx:#ece8f5;--mut:#9a93b0;--ac:#a98bf0;--bd:#3a3450}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}input,textarea{-webkit-user-select:text;user-select:text}
body.admfocus #side{display:none}
body.admfocus #bar>*:not(.keep):not(#nm){display:none}
#fs,#fsb,#th{width:40px;padding-left:0;padding-right:0;text-align:center}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
#login{max-width:420px;margin:10vh auto;padding:0 18px}
#lf{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:22px}
#lf h1{margin:0;font-size:22px}#lf .lead{margin:0 0 6px;color:var(--mut)}
#lf label{font-weight:600}#lf label.chk{font-weight:400;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:14px}
#lf input[type=password],#lf input[type=text]#pw{padding:12px;font-size:16px}
#pw{padding:12px;font-size:16px}
#go{padding:12px;font-size:16px;background:var(--ac);color:#fff;border-color:var(--ac)}
#msg{min-height:20px}#msg.err{color:#d32f2f}
#lf details{color:var(--mut);font-size:14px}#lf summary{cursor:pointer}#lf details p{margin:8px 0 0}
#app{height:100%;display:flex}
#app[hidden],#login[hidden],#lf [hidden]{display:none}
#side{width:250px;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:10px;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.st{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer}
.st.on{background:color-mix(in srgb,var(--ac) 16%,transparent)}
.dot{width:8px;height:22px;border-radius:4px;flex:none}
.foot{display:flex;gap:6px;flex-wrap:wrap}.foot button{font-size:13px;padding:5px 8px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap}#nm{flex:1;min-width:120px;font-size:17px}
#work{flex:1;display:flex;min-height:0;position:relative}
#work iframe{flex:1;min-width:0;border:0;min-height:0}
#tasks{width:470px;max-width:60%;border-left:1px solid var(--bd);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#tasks[hidden]{display:none}
.tr{display:flex;gap:6px;align-items:center;padding:6px 8px;flex-wrap:wrap}
.tr select{max-width:190px;font-size:13px}.tr button,.tr input{font-size:13px}
#tnum{width:64px}
#tview{flex:1;min-height:0;overflow:auto;background:#cfc9de;padding:3px}
#tbox{position:relative;margin:0 auto;background:#fff}
#tcv{display:block}
#tov{position:absolute;inset:0;touch-action:pan-y pinch-zoom;cursor:crosshair}
.card{position:absolute;border:2px solid transparent;border-radius:6px;pointer-events:none}
.card.hot{border-color:var(--ac);background:rgba(106,63,196,.07)}
.plus{position:absolute;width:30px;height:30px;border-radius:50%;padding:0;background:#2e7d32;color:#fff;border-color:#2e7d32;font-size:20px;line-height:1;cursor:pointer}
.lk{position:absolute;cursor:pointer;border-radius:4px}.lk:hover{outline:2px solid rgba(106,63,196,.55)}
.mk{position:absolute;left:0;right:0;height:3px;background:#d32f2f;pointer-events:none}
.sel{position:absolute;border:2px dashed #6a3fc4;background:rgba(106,63,196,.12);pointer-events:none}
.selbar{position:absolute;display:flex;gap:6px;z-index:3}
@media (max-width:700px){#tasks{position:absolute;inset:0;width:auto;max-width:none;z-index:5;border-left:0}}
#msg{color:var(--mut)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg>div{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dlg h2{margin:0;font-size:18px}.dlg .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bd)}
.dlg .row .grow{flex:1;min-width:160px}.dlg .mut{color:var(--mut);font-size:13px}.dlg input{width:100%;padding:9px;font-size:15px}
.dlg .pri,#lf .pri{background:var(--ac);color:#fff;border-color:var(--ac)}.dlg .err{color:#d32f2f;min-height:18px}
.dlg code{font-size:12px;word-break:break-all;background:color-mix(in srgb,var(--ac) 10%,transparent);padding:4px 6px;border-radius:6px}
body.nosidebar #side{display:none}
.st.sub{padding-left:30px}.st.sub .dot{width:6px;height:16px}.st .gm{cursor:pointer}
.st .gi{font-size:15px;line-height:1}.st .gm{font-size:11px;color:var(--mut);margin-left:auto}.lh{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;padding:10px 8px 2px}
#side .top{flex-wrap:wrap;gap:6px}
.memlist{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto;margin:8px 0}.memlist label{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
.badge{background:#d32f2f;color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:auto}
#hwk{background:var(--ac);color:var(--panel);border:1px solid var(--ac);font-weight:700}#hwk:hover{background:color-mix(in srgb,var(--ac) 88%,var(--tx))}
#hwkn:not(:empty){background:var(--panel);color:var(--ac);border-radius:10px;font-size:11px;font-weight:800;padding:1px 6px;margin-left:6px}
.dlg>div.wide{max-width:920px}
.hwplus{width:auto;padding:0 8px;font-size:12px;border-radius:15px;background:var(--ac);border-color:var(--ac)}
#hwtray{border-top:2px solid var(--ac);background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-height:46%;min-height:0}
#hwtray[hidden]{display:none}
#hwtray .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#hwtray .r input{font-size:14px}
#hwtray .hint{font-size:12px;color:var(--mut)}
#hwcards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;min-height:0}
.hc{flex:none;width:190px;border:1px solid var(--bd);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:5px;font-size:13px;position:relative}
.hc img{width:100%;height:84px;object-fit:contain;background:#fff;border-radius:6px}
.hc .tx{height:84px;overflow:auto;white-space:pre-wrap;background:color-mix(in srgb,var(--ac) 6%,transparent);border-radius:6px;padding:4px}
.hc select,.hc input{font-size:13px;padding:4px 6px;width:100%}
.hc .x{position:absolute;top:2px;right:2px;padding:0 7px;border-radius:12px;font-size:13px}
.hwi{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}.hwi .grow{flex:1;min-width:180px}
.chip{font-size:12px;padding:2px 9px;border-radius:12px;background:color-mix(in srgb,var(--ac) 12%,transparent);white-space:nowrap}
.chip.sent{background:#d32f2f;color:#fff}.chip.checked{background:color-mix(in srgb,#2e7d32 18%,transparent)}
.ct{border:1px solid var(--bd);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.ct img{max-width:100%;max-height:260px;object-fit:contain;align-self:flex-start;background:#fff;border-radius:6px;cursor:zoom-in}
.ct .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mk2{padding:4px 12px}.mk2.on.y{background:#2e7d32;border-color:#2e7d32;color:#fff}.mk2.on.n{background:#d32f2f;border-color:#d32f2f;color:#fff}
.ok{color:#2e7d32;font-weight:600}.no{color:#d32f2f;font-weight:600}
.phs{display:flex;gap:8px;flex-wrap:wrap}.phs img{width:110px;height:140px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:zoom-in}
.dlg textarea{width:100%;min-height:70px;font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:8px}
@media (max-width:700px){#app{flex-direction:column}#side{width:100%;max-height:34%;border-right:0;border-bottom:1px solid var(--bd)}}
</style>
</head>
<body>
<div id="login" hidden>
 <form id="lf" autocomplete="on">
  <h1 id="lh">Вход для преподавателя</h1>
  <p class="lead" id="ll">Здесь вы создаёте личные доски для учеников и открываете их.</p>
  <label for="rn" class="reg" hidden>Ваше имя</label>
  <input id="rn" class="reg" hidden autocomplete="name" placeholder="Например, Анна Сергеевна" maxlength="60">
  <label for="lg">Логин</label>
  <input id="lg" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Логин" autofocus>
  <label for="pw">Пароль</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Пароль">
  <label for="pw2" class="reg" hidden>Пароль ещё раз</label>
  <input id="pw2" class="reg" hidden type="password" autocomplete="new-password" placeholder="Повторите пароль">
  <label class="chk"><input type="checkbox" id="showpw"> Показать пароль</label>
  <button id="go" type="submit">Войти</button>
  <div id="msg" role="alert"></div>
  <details id="lhelp">
   <summary>Забыли пароль?</summary>
   <p>Напишите владельцу сайта: он выдаст вам новый пароль.</p>
   <p>Ученикам пароль не нужен: они открывают только свою личную ссылку.</p>
  </details>
 </form>
</div>
<div id="app" hidden>
 <div id="side">
  <div class="top"><b>Ученики</b><button id="addS">+ Ученик</button><button id="addG" title="Группа: общие доски для нескольких учеников, у каждого свой кабинет">+ Группа</button></div>
  <div id="list"></div>
  <div id="whoami" style="font-size:12px;color:var(--mut)"></div>
  <div class="foot"><button id="tch" hidden title="Пригласить репетиторов и управлять их аккаунтами">Репетиторы</button><button id="mdl" hidden title="3D-модель огней аэродрома: ссылка видна только вам">3D-огни</button><button id="tgb" title="Telegram-бот: уведомления и конспекты">Telegram</button><button id="cpw" title="Сменить свой пароль">Пароль</button><button id="bk">Скачать копию</button><button id="rs">Загрузить копию</button><input type="file" id="rf" accept=".json" hidden><button id="lo" title="Выйти из кабинета на этом устройстве">Выйти</button><button id="rb" title="Вернуть учеников и доски из копии, которую кабинет сам сохраняет в вашем браузере">Восстановить из автокопии</button><div id="bkst" style="font-size:12px;color:var(--mut);width:100%"></div></div>
 </div>
 <div id="main">
  <div id="bar"><button id="hs" title="Скрыть или показать список учеников">◧</button><b id="nm">Выберите ученика</b><button id="tk" class="keep">Задачи</button><button id="hwk" class="keep" title="Домашние задания ученика">📚 Домашка<span id="hwkn"></span></button><button id="tgs" title="Отправить конспект урока ученику и родителям в Telegram">📨 Конспект</button><button id="lnk">Ссылка ученика</button><button id="mem" hidden title="Кто занимается в этой группе">👥 Участники</button><button id="ren">Переименовать</button><button id="del">Удалить</button><button id="fs" class="keep" title="Фокус: убрать панели">⛶</button><button id="fsb" class="keep" title="Во весь экран (Esc — выйти)">⤢</button><button id="th" class="keep" title="Светлая / тёмная тема">◐</button></div>
  <div id="work">
   <iframe id="fr" allow="microphone; camera; autoplay; clipboard-write"></iframe>
   <div id="tasks" hidden>
    <div class="tr"><select id="tbook"></select><button id="tadd">+ Сборник</button><button id="tdel" title="Убрать сборник из списка">Убрать</button><input type="file" id="tfile" accept=".pdf,application/pdf" multiple hidden><button id="tclose" style="margin-left:auto">✕</button></div>
    <div class="tr"><button id="tback" title="Назад">↩</button><button id="tprev">←</button><input id="tnum" type="number" min="1"><span id="tcnt"></span><button id="tnext">→</button><select id="tol"><option value="">Оглавление…</option></select></div>
    <div class="tr"><input id="tq" placeholder="Номер задачи, например 4.19" style="flex:1;min-width:120px"><button id="tfind">Найти</button><button id="tpage">Страница целиком → на доску</button></div>
    <div class="tr" style="padding-top:0"><select id="tgap" title="Сколько свободного места оставлять под решением между задачами"><option value="120">Место под решение: мало</option><option value="350">Место под решение: среднее</option><option value="600">Место под решение: много</option></select><label id="tanal" title="Когда отправляете задачу из сборника на доску, её аналог (случайный, ещё не задававшийся этому ученику) сам добавляется в черновик домашки. В конце урока: «Домашка» → «Продолжить черновик» → «Отправить»." style="display:inline-flex;gap:5px;align-items:center;font-size:13px;white-space:nowrap;cursor:pointer"><input type="checkbox" id="tanalc"> 🪄 Аналог в домашку</label><span id="tmsg" style="font-size:12px;color:var(--mut)"></span></div>
    <div id="tview"><div id="tbox"><canvas id="tcv"></canvas><div id="tov"></div></div></div>
   </div>
  </div>
  <div id="hwtray" hidden></div>
 </div>
</div>
<script>
(function(){
const $=i=>document.getElementById(i);
let tok=localStorage.getItem('tok')||'',students=[],cur=null,me=null,regMode=false;
const invite=new URLSearchParams(location.search).get('invite');
const api=window.boardApi=(p,o)=>fetch(p,Object.assign({},o,{headers:{'X-Token':tok,'Content-Type':'application/json'}}));
const post=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
function setTok(j){tok=j.token;localStorage.setItem('tok',tok);if(j.login)localStorage.setItem('tlogin',j.login)}
function setReg(on){regMode=on;document.querySelectorAll('#lf .reg').forEach(e=>e.hidden=!on);
 $('lh').textContent=on?'Регистрация преподавателя':'Вход для преподавателя';
 $('ll').textContent=on?'Вас пригласили на доску. Придумайте логин и пароль — с ними вы будете входить в свой кабинет.':'Здесь вы создаёте личные доски для учеников и открываете их.';
 $('go').textContent=on?'Создать аккаунт':'Войти';$('pw').autocomplete=on?'new-password':'current-password';$('lhelp').hidden=on}
function showLogin(t,bad){$('app').hidden=true;$('login').hidden=false;$('msg').textContent=t||'';$('msg').className=bad?'err':'';$('go').disabled=false;(regMode?$('rn'):$('lg')).focus()}
async function load(){
 const r=await api('/api/admin/me');
 if(r.status===503)return showLogin('На сервере не задан пароль владельца (ADMIN_KEY).',true);
 if(r.status===401){const had=!!tok;tok='';localStorage.removeItem('tok');return showLogin(had?'Вход устарел или пароль сменили. Войдите снова.':'',had)}
 me=await r.json();localStorage.setItem('tlogin',me.login);
 students=await (await api('/api/admin/students')).json();
 $('login').hidden=true;$('app').hidden=false;$('tch').hidden=me.role!=='owner';$('mdl').hidden=me.role!=='owner';$('whoami').textContent='Вы вошли как '+me.name+' ('+me.login+')';render();
 const last=localStorage.getItem('last:'+me.login);
 if(!cur&&students.length)pick(students.some(s=>s.id===last)?last:students[0].id);
}
const gOpen=new Set(); // какие группы раскрыты в списке
function render(){const l=$('list');l.innerHTML='';
 if(!students.length){const d=document.createElement('div');d.className='st';d.style.color='var(--mut)';d.textContent='Пока нет учеников. Нажмите «+ Ученик».';l.appendChild(d)}
 // ученики из групп не дублируются в общем списке — они видны под своей группой, когда её раскрыть
 const isG=s=>s.type==='group',groups=students.filter(isG),inG=new Set(groups.flatMap(g=>g.members||[]));
 const row=(s,sub)=>{const d=document.createElement('div');d.className='st'+(s.id===cur?' on':'')+(sub?' sub':'');
  const dot=document.createElement('span');if(isG(s)){dot.className='gi';dot.textContent='👥'}else{dot.className='dot';dot.style.background=s.color}
  const t=document.createElement('span');t.textContent=s.name;d.append(dot,t);
  const pn=(window.hwPend||{})[s.id];
  if(isG(s)){const open=gOpen.has(s.id),m=document.createElement('span');m.className='gm';m.textContent=(s.members||[]).length+' уч. '+(open?'▾':'▸');m.title=open?'Свернуть':'Показать учеников группы';
   m.onclick=e=>{e.stopPropagation();open?gOpen.delete(s.id):gOpen.add(s.id);render()};d.append(m)}
  if(pn){const b=document.createElement('span');b.className='badge';b.textContent=pn;b.title='Домашек ждут проверки: '+pn;if(isG(s))b.style.marginLeft='6px';d.append(b)}
  d.onclick=()=>{if(isG(s))gOpen.add(s.id);pick(s.id)};l.appendChild(d)};
 students.filter(s=>!isG(s)&&!inG.has(s.id)).forEach(s=>row(s));
 if(groups.length){const h=document.createElement('div');h.className='lh';h.textContent='Группы';l.appendChild(h)}
 groups.forEach(g=>{if((g.members||[]).includes(cur))gOpen.add(g.id);row(g);
  if(gOpen.has(g.id))(g.members||[]).map(id=>students.find(x=>x.id===id)).filter(Boolean).forEach(s=>row(s,true))});
 if(window.hwOnPick)window.hwOnPick()}
function pick(id,hash){cur=id;if(me)localStorage.setItem('last:'+me.login,id);const s=students.filter(x=>x.id===id)[0];
 if(!s){cur=null;$('nm').textContent='Выберите ученика';$('fr').src='about:blank';render();return}
 $('nm').textContent=(s.type==='group'?'👥 ':'')+s.name;render();$('mem').hidden=s.type!=='group';$('lnk').hidden=s.type==='group';
 const f=$('fr'),prev=f.getAttribute('src')||'';
 if(!prev.startsWith('/b/')||prev.split(/[/#]/)[2]===id){f.src='/b/'+id+(hash||'');return}
 // перед сменой ученика доска сохраняет снимок для вечернего конспекта (не дольше 4 с)
 let done=false;const go=()=>{if(done)return;done=true;removeEventListener('message',h);if(cur===id)f.src='/b/'+id+(hash||'')};
 const h=e=>{if(e.origin===location.origin&&e.data&&e.data.t==='snapdone')go()};addEventListener('message',h);setTimeout(go,4000);
 try{f.contentWindow.postMessage({t:'snapnow'},location.origin)}catch(e){go()}}
window.hwCtx={cur:()=>cur,students:()=>students,render:()=>render(),open:(id,hash)=>pick(id,hash),isGroup:id=>(students.find(x=>x.id===id)||{}).type==='group'};
async function op(o){const r=await api('/api/admin/op',{method:'POST',body:JSON.stringify(o)});
 const j=r.ok?await r.json():null;if(!j||j.error){alert(j&&j.error||'Не получилось');return false}
 if(Array.isArray(j))students=j;render();return j}
$('lf').onsubmit=async e=>{e.preventDefault();
 const login=$('lg').value.trim().toLowerCase(),pw=$('pw').value;$('msg').className='';
 if(regMode){
  const name=$('rn').value.trim();
  if(!name)return showLogin('Укажите имя',true);
  if(!/^[a-z0-9._-]{3,32}$/.test(login))return showLogin('Логин: от 3 до 32 латинских букв или цифр (можно . _ -)',true);
  if(pw.length<8)return showLogin('Пароль должен быть не короче 8 символов',true);
  if(pw!==$('pw2').value)return showLogin('Пароли не совпадают',true);
  $('go').disabled=true;$('msg').textContent='Создаю аккаунт…';
  const r=await post('/api/register',{code:invite,login,name,password:pw}),j=r.ok?await r.json():{error:r.status===429?'Слишком много попыток, подождите 10 минут':'Не получилось'};
  if(j.error)return showLogin(j.error,true);
  setTok(j);history.replaceState(null,'','/t');setReg(false);return load();
 }

function detect(oc){

const api=(p,o)=>window.boardApi(p,o);
const bkey=k=>k+':'+(localStorage.getItem('tlogin')||'admin');
const bdb=()=>new Promise((res,rej)=>{try{const q=indexedDB.open('board-backups',1);q.onupgradeneeded=()=>q.result.createObjectStore('b');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
async function bget(k){const db=await bdb();const v=await bget0(db,bkey(k));if(v||localStorage.getItem('tlogin')!=='admin')return v;return bget0(db,k)} // старые копии владельца лежат без логина
async function bget0(db,k){return new Promise((res,rej)=>{const q=db.transaction('b').objectStore('b').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function bput(k,v){const db=await bdb();return new Promise((res,rej)=>{const t=db.transaction('b','readwrite');t.objectStore('b').put(v,bkey(k));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
const fmt=t=>new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
async function serverCount(){const r=await api('/api/admin/students');return r.ok?(await r.json()).length:-1}
async function makeBackup(){
 try{
  if(await serverCount()<1)return; // пустой сервер не затирает копию
  const r=await api('/api/admin/backup');if(!r.ok)return;
  const data=await r.json(),now=Date.now(),cur=await bget('latest'),day=await bget('daily');
  if(cur&&(!day||now-day.t>20*3600e3))await bput('daily',cur);
  await bput('latest',{t:now,data:data});
  $('bkst').textContent='Автокопия: '+fmt(now);
 }catch(e){$('bkst').textContent='Автокопия не сохранилась'}
}
async function restore(b){
 const r=await api('/api/admin/op',{method:'POST',body:JSON.stringify({t:'restore',merge:true,data:b.data})});
 if(r.ok)location.reload();else alert('Не получилось восстановить');
}
async function manualRestore(){
 for(const k of ['latest','daily']){
  const b=await bget(k).catch(()=>null);if(!b)continue;
  if(confirm('Восстановить из '+(k==='latest'?'последней':'суточной')+' автокопии от '+fmt(b.t)+' (учеников: '+b.data.index.students.length+')? Недостающие ученики и доски вернутся, текущие останутся как есть.'))return restore(b);
 }
 alert('Подходящей автокопии нет');
}
$('rb').onclick=manualRestore;
async function start(){
 const n=await serverCount();if(n<0)return;
 const b=await bget('latest').catch(()=>null);
 if(n===0&&b&&b.data.index.students.length){
  if(confirm('На сервере пусто (так бывает после обновления файлов на GitHub). Вернуть учеников и доски из автокопии от '+fmt(b.t)+'?'))return restore(b);
  $('bkst').textContent='Есть автокопия от '+fmt(b.t)+' (кнопка «Восстановить из автокопии»)';
 }else await makeBackup();
 setInterval(makeBackup,180000);
}
const tt=setInterval(()=>{if(!$('app').hidden){clearInterval(tt);start()}},700);
})();
</script>
<script>

 rej()};im.onerror=rej;im.src=src})}

 if(!d)d=(await loadDraft(sid))||{sid,tasks:[],title:new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'}),due:''};

 d.tasks.push(t);if(mine){tray(true);dirty()}else await saveDraft(d);

 window.hwDraft=true;tray();if(window.hwTasksRedraw)window.hwTasksRedraw();

function repRow(){

 const cb=el('input',{type:'checkbox',checked:R.on});
 cb.onchange=async()=>{const r=await api('/api/admin/hw-rep',{method:'POST',body:JSON.stringify({on:cb.checked})});if(r.ok){R.on=(await r.json()).on;tray()}};
 const row=el('div',{className:'r'},el('label',{title:'Неверно решённые задачи через неделю сами добавляются в новую домашку, пока ученик не решит их верно. Можно выключить на время — для всех учеников.',style:'display:flex;gap:4px;align-items:center;cursor:pointer'},cb,el('span',{textContent:'🔁 Работа над ошибками'})));
 if(!R.on){row.append(el('span',{className:'hint',textContent:'выключено — задачи на повторение не добавляются'}));return row}
 const keep=R.due.filter(x=>draft.rep.includes(x.id));
 if(!R.due.length)row.append(el('span',{className:'hint',textContent:R.left?'ошибок к повторению сейчас нет (вернутся через неделю после ошибки)':'у ученика пока нет ошибок для повторения'}));
 else{row.append(el('span',{className:'hint',textContent:keep.length?'+ '+keep.length+' '+(keep.length===1?'задача':'задачи')+' на повторение добавятся в конец:':'задачи на повторение убраны'}));
  R.due.forEach(x=>{const on=draft.rep.includes(x.id);
   const b=el('span',{className:'chip',title:x.text||'',style:'display:inline-flex;gap:4px;align-items:center;padding:2px 4px 2px 6px;border:1px solid var(--bd);border-radius:8px;font-size:12px;opacity:'+(on?1:.45)});
   if(x.img){const im=el('img',{src:'/hwimg/'+draft.sid+'/'+x.img,style:'height:28px;max-width:90px;object-fit:contain;background:#fff;border-radius:4px;cursor:zoom-in'});im.onclick=()=>window.open(im.src);b.append(im)}
   b.append(el('span',{textContent:(x.num?'№'+x.num:'задача')+(x.n>1?' (ошибка ×'+x.n+')':'')}));
   b.append(el('button',{textContent:on?'✕':'↺',title:on?'Не добавлять в эту домашку':'Вернуть',style:'padding:0 6px;line-height:18px',onclick:()=>{draft.rep=on?draft.rep.filter(y=>y!==x.id):draft.rep.concat(x.id);tray()}}));
   row.append(b)})}

function stopDraft(){draft=null;window.hwDraft=false;$('hwtray').hidden=true;if(window.hwTasksRedraw)window.hwTasksRedraw()}
async function hideDraft(){if(draft&&draft.tasks.length){await saveDraft();alert('Черновик сохранён. Продолжить или отправить: кнопка «Домашка» → «Продолжить черновик».')}else if(draft)api('/api/admin/hw',{method:'POST',body:JSON.stringify({t:'draft-del',s:draft.sid})});stopDraft()}
function tray(scrollEnd){

 const du=el('input',{type:'date',value:draft.due,title:'Сдать до'});du.oninput=()=>{draft.due=du.value;dirty()};
 const fileIn=el('input',{type:'file',accept:'image/*',multiple:true,hidden:true});
 const pdfIn=el('input',{type:'file',accept:'.pdf,application/pdf',hidden:true});pdfIn.onchange=()=>{const f=pdfIn.files[0];pdfIn.value='';if(f)importPdf(f)};fileIn.onchange=()=>{[...fileIn.files].forEach(window.hwAddFile);fileIn.value=''};
 const go=el('button',{className:'pri',textContent:'Отправить ученику',disabled:!draft.tasks.length,onclick:sendDraft});
 go.style.cssText='background:var(--ac);color:#fff;border-color:var(--ac)';
 t.append(
  el('div',{className:'r'},el('b',{textContent:'Новая домашка: '+sName(draft.sid)}),ti,el('span',{textContent:'сдать до'}),du,go,
   el('button',{textContent:'Свернуть',title:'Черновик останется: продолжите позже через «Домашка»',onclick:hideDraft}),
   el('button',{textContent:'🗑',title:'Удалить черновик',onclick:async()=>{if(draft.tasks.length&&!confirm('Удалить черновик? Собранные задачи пропадут.'))return;const sid=draft.sid;stopDraft();await saving;api('/api/admin/hw',{method:'POST',body:JSON.stringify({t:'draft-del',s:sid})})}}),
   el('span',{className:'hint dst',textContent:draft.tasks.length?'✓ Черновик сохранён':''})),
  el('div',{className:'r'},
   el('button',{textContent:'📚 Из сборника',title:'В панели «Задачи» у каждой задачи появится кнопка «+ ДЗ»; можно выделить область и нажать «В домашку»',onclick:()=>window.hwOpenTasks&&window.hwOpenTasks()}),
   el('button',{textContent:'📋 Вставить скриншот',onclick:pasteBtn}),
   el('button',{textContent:'🖼 Файл',onclick:()=>fileIn.click()}),fileIn,
   el('button',{textContent:'📄 PDF с ответами',title:'Домашка из PDF-файла: задачи нарежутся сами, ответы из конца файла подставятся для автопроверки',onclick:()=>pdfIn.click()}),pdfIn,
   el('button',{textContent:'✎ Текстом',onclick:()=>{draft.tasks.push({src:null,text:'',num:0,ans:''});tray(true);dirty();const a=$('hwcards').lastChild;if(a)a.querySelector('textarea').focus()}}),
   el('span',{className:'hint',textContent:'Скриншот задачи с сайта: сделайте снимок экрана и нажмите ⌘V (Ctrl+V) здесь. Если у задачи короткий ответ — впишите его, он проверится сам.'})),
  repRow()||'');

  if(k.src)c.append(el('img',{src:k.src}));

  const sel=el('select',{title:'Номер задания в экзамене — для прогресса ученика'});sel.append(el('option',{value:0,textContent:'№ задания — не указан'}));
  for(let n=1;n<=19;n++)sel.append(el('option',{value:n,textContent:'№'+n}));sel.value=k.num;sel.onchange=()=>{k.num=+sel.value;dirty()};c.append(sel);
  const an=el('input',{value:k.ans,placeholder:'Ответ (если короткий)',title:'Ученик впишет ответ, и он проверится сам. Несколько вариантов — через ;'});an.oninput=()=>{k.ans=an.value;k.auto=false;dirty();c.querySelector('.auto')&&c.querySelector('.auto').remove()};c.append(an);
  if(k.auto)c.append(el('span',{className:'auto',textContent:'✓ ответ из сборника',style:'font-size:11px;color:#2e7d32'}));
  c.append(el('button',{className:'x',textContent:'✕',title:'Убрать задачу',onclick:()=>{draft.tasks.splice(i,1);tray();dirty()}}));
  cs.append(c)});

}
async function pasteBtn(){
 try{const it=await navigator.clipboard.read();for(const x of it){const ty=x.types.find(v=>/^image\//.test(v));if(ty){window.hwAddFile(await x.getType(ty));return}}
  alert('В буфере обмена нет картинки. Сделайте скриншот задачи (на Mac: ⌘⇧4 с Ctrl — сразу в буфер) и нажмите снова.')}
 catch(e){alert('Нажмите ⌘V (на Windows — Ctrl+V), пока открыта эта полоса.')}
}
// ---------- домашка из PDF: задачи нарезаются по «№1», «№2»…, ответы берутся со страницы «Ответы» в конце ----------
let pdfLibP=null;
const pdfLib=()=>pdfLibP||(pdfLibP=import('/pdfjs/pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc='/pdfjs/pdf.worker.min.mjs';return m}));
const cleanAns=a=>String(a).replace(/\s+/g,'').replace(/[−–↑]/g,'-').replace(/[<>⟨⟩«»]/g,'').replace(/[.;]+$/,''); // «<14>» → 14, минус бывает «↑»
const NUM='-?\\d+(?:[.,]\\d+)?(?:/\\d+)?',okAns=a=>!!a&&new RegExp('^'+NUM+'(?:;'+NUM+')*$').test(a); // число, дробь или несколько вариантов через ;
let pageCache=null; // последняя отрисованная страница: несколько задач с одной страницы не рисуем заново
async function pagePix(doc,p){
 if(pageCache&&pageCache.doc===doc&&pageCache.p===p)return pageCache;
 const pg=await doc.getPage(p),base=pg.getViewport({scale:1}),sc=Math.min(2.2,1100/base.width),vp=pg.getViewport({scale:sc});
 const full=el('canvas',{width:Math.round(vp.width),height:Math.round(vp.height)}),fx=full.getContext('2d',{willReadFrequently:true});
 fx.fillStyle='#fff';fx.fillRect(0,0,full.width,full.height);await pg.render({canvasContext:fx,viewport:vp,intent:'print'}).promise; // «print» — рисуется и в фоновой вкладке
 const x0=Math.round(full.width*.05),w=Math.round(full.width*.9);
 const d=fx.getImageData(x0,0,w,full.height).data,blank=y=>{if(y<0||y>=full.height)return true;for(let x=0;x<w;x+=2){const i=(y*w+x)*4;if(d[i]<235||d[i+1]<235||d[i+2]<235)return false}return true};
 return pageCache={doc,p,full,x0,w,sc,H:base.height,blank,px:y=>Math.max(0,Math.min(full.height,Math.round((base.height-y)*sc)))};
}
function cut(P,y0,y1){const c=el('canvas',{width:P.w,height:y1-y0});c.getContext('2d').drawImage(P.full,P.x0,y0,P.w,y1-y0,0,0,P.w,y1-y0);
 let src=c.toDataURL('image/png');if(src.length>800000)src=c.toDataURL('image/jpeg',.88);return src}
async function cropPdf(doc,p,yTop,yBot){ // область страницы по высоте (в координатах PDF, снизу вверх) → картинка, пустые поля сверху и снизу обрезаются
 const P=await pagePix(doc,p);let y0=Math.max(0,P.px(yTop)-8),y1=P.px(yBot);
 while(y1>y0+20&&P.blank(y1-1))y1--;while(y0<y1-20&&P.blank(y0))y0++;
 return cut(P,Math.max(0,y0-10),Math.min(P.full.height,y1+12));
}
// одна задача со страницы: метка «№N» (anchor) стоит не обязательно у самого верха задачи — текст и рисунок могут начинаться выше.
// Поэтому границы ищем по пустой полосе между задачами: вверх от своей метки и вверх от метки следующей задачи.
async function cropTask(doc,p,anchor,prev,next,list){
 const P=await pagePix(doc,p),G=Math.round(7*P.sc);
 // ищем вверх от метки пустую полосу: сначала «нормальную» (≥7 pt), а если задачи стоят вплотную — самую широкую в пределах 45 pt
 const gapAbove=(from,lim)=>{let run=0,best=-1,bestLen=0;const near=from-Math.round(45*P.sc);
  for(let y=from;y>=lim;y--){if(P.blank(y)){run++;if(run>=G)return y+run;if(y>=near&&run>bestLen&&run>=2){bestLen=run;best=y+run}}else run=0}
  return best};
 const aPx=P.px(anchor),lim=prev!=null?P.px(prev)+2:0;
 let y0=gapAbove(aPx,lim);if(y0<0)y0=Math.max(lim,aPx-Math.round(8*P.sc));
 let y1;if(next!=null){const nPx=P.px(next);const t=gapAbove(nPx,aPx+1);y1=t>0?t-1:nPx}else y1=P.px(30);
 if(list){let run=0;const g=Math.round(5*P.sc);for(let y=aPx+Math.round(4*P.sc);y<y1;y++){if(P.blank(y)){if(++run>=g){y1=y-run+1;break}}else run=0}}

// Разбор PDF: где начинается каждая задача и какие у неё ответы. Понимает три вида файлов:
// 1) MathStart: метки task::N (самый точный); 2) надписи «№N.» в начале задачи; 3) обычный нумерованный список «1.», «2.» …
// Ответы: страница «Ответы: №1. 25 №2. …», список «1) 25 2) 7» или таблица с колонками «№ | Ответ».
async function analyzePdf(doc){
 const n=doc.numPages,items={},H={};
 for(let p=1;p<=n;p++){const pg=await doc.getPage(p);items[p]=(await pg.getTextContent()).items.filter(i=>i.str.trim());H[p]=pg.getViewport({scale:1}).height}
 const X=i=>i.transform[4],Y=i=>i.transform[5];
 // страницы с ответами: с той, где заголовок «Ответы», до конца (только во второй половине файла)
 let ansFrom=0;for(let p=n;p>Math.max(1,n/2);p--)if(items[p].some(i=>/^\s*Ответы\s*:?\s*$/i.test(i.str)||/^\s*Ответы\s*:/i.test(i.str)))ansFrom=p;
 const ans={};let ansAt=null; // ansAt — где начинается таблица ответов (задачи ищем только выше)
 if(ansFrom){let txt='';for(let p=ansFrom;p<=n;p++)txt+=' '+items[p].filter(i=>Y(i)>45&&Y(i)<H[p]-45).map(i=>i.str).join(' '); // без колонтитулов (номер страницы)
  txt=txt.replace(/^[\s\S]*?Ответы\s*:?/i,' ');
  let m,re=/№\s*(\d+)\s*[.)]\s*([\s\S]+?)(?=\s№\s*\d+\s*[.)]|$)/g;while((m=re.exec(txt)))ans[+m[1]]=cleanAns(m[2]);
  if(!Object.keys(ans).length){re=/(?:^|\s)(\d+)\s*[.)]\s*(-?\s*[\d\s]+(?:[.,]\s*\d+)?)/g;while((m=re.exec(txt)))ans[+m[1]]=cleanAns(m[2])}}
 if(!Object.keys(ans).length){ // таблица «№ | Ответ | …»
  for(let p=1;p<=n&&!ansAt;p++)for(const h of items[p]){if(!/^\s*Ответы?\s*$/i.test(h.str))continue;
   const row=items[p].filter(i=>Math.abs(Y(i)-Y(h))<3),no=row.find(i=>/^\s*№\s*$/.test(i.str)&&X(i)<X(h));
   if(no){const nextX=Math.min(...row.filter(i=>X(i)>X(h)+5).map(X),1e9);ansAt={p,y:Y(h)+2,numX:X(no),ansX:X(h),nextX};break}}
  if(ansAt){const {numX,ansX,nextX}=ansAt;
   for(let p=ansAt.p;p<=n;p++){const rows={};
    items[p].forEach(i=>{if(p===ansAt.p&&Y(i)>=ansAt.y)return;const k=Math.round(Y(i)/3);(rows[k]=rows[k]||[]).push(i)});
    for(const k in rows){const r=rows[k].sort((a,b)=>X(a)-X(b)),num=r.find(i=>X(i)>=numX-6&&X(i)<ansX-3&&/^\s*\d{1,3}\s*$/.test(i.str));
     if(!num)continue;const a=r.filter(i=>X(i)>=ansX-4&&X(i)<nextX-4).map(i=>i.str).join(' ');if(a.trim())ans[+num.str]=cleanAns(a)}}
   if(Object.keys(ans).length)ansFrom=ansAt.p}}
 const last=ansFrom?(ansAt?ansAt.p:ansFrom-1):n,before=(p,y)=>!ansAt||p<ansAt.p||(p===ansAt.p&&y>ansAt.y+2);
 const starts=[];let list=false;
 for(let k=1;k<=300;k++){let de=null;try{de=await doc.getDestination('task::'+k)}catch(e){}if(!Array.isArray(de))break;let p=0;try{p=(await doc.getPageIndex(de[0]))+1}catch(e){break}if(p>last)break;starts.push({k,p,y:+de[3]||0})}
 if(!starts.length)for(let p=1;p<=last;p++)items[p].forEach(i=>{const m=i.str.match(/^\s*№\s*(\d+)\s*\.?\s*$/);if(m&&X(i)<150&&before(p,Y(i)))starts.push({k:+m[1],p,y:Y(i)+16})});
 if(!starts.length){ // нумерованный список: «1.» / «1)» в начале строки, все номера на одной вертикали
  const c=[];for(let p=1;p<=last;p++)items[p].forEach(i=>{const m=i.str.match(/^\s*(\d{1,3})\s*[.)](?:\s|$)/);if(m&&before(p,Y(i)))c.push({k:+m[1],p,y:Y(i),x:X(i),h:i.height||10})});
  const byX={};c.forEach(o=>{const g=Math.round(o.x/4);(byX[g]=byX[g]||[]).push(o)});
  const best=Object.values(byX).sort((a,b)=>b.length-a.length)[0]||[];
  if(best.length>=2){let prev=0;best.sort((a,b)=>a.p-b.p||b.y-a.y).forEach(o=>{if(o.k>prev){starts.push({k:o.k,p:o.p,y:o.y+o.h*0.9+2});prev=o.k}});list=true}}
 return {starts,ans,ansFrom,last,list};
}
async function importPdf(file){
 if(!draft)return;const say=m=>{const t=document.querySelector('#hwtray .hint');if(t)t.textContent=m};
 try{
  say('Читаю PDF…');const lib=await pdfLib(),doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,n=doc.numPages;
  const {starts,ans,ansFrom,last,list}=await analyzePdf(doc);
  let added=0,withAns=0;const noAns=[];
  if(starts.length){
   for(let i=0;i<starts.length;i++){const s=starts[i],nx=starts[i+1],pv=starts[i-1];
    say('Нарезаю задачу '+(i+1)+' из '+starts.length+'…');
    const src=await cropTask(doc,s.p,s.y,pv&&pv.p===s.p?pv.y:null,nx&&nx.p===s.p?nx.y:null,list),a=okAns(ans[s.k])?ans[s.k]:'';
    await window.hwAdd(src,{ans:a});if(a)withAns++;else if(ansFrom)noAns.push('№'+s.k+(ans[s.k]?' («'+ans[s.k]+'»)':''));added++}
  }else{ // разметки нет — задания постранично
   for(let p=1;p<=last;p++){say('Страница '+p+' из '+last+'…');const pg=await doc.getPage(p),h=pg.getViewport({scale:1}).height;await window.hwAdd(await cropPdf(doc,p,h-20,20),{});added++}
  }
  tray(true);
  alert('Из PDF добавлено задач: '+added+'.'+(withAns?' Ответы для автопроверки найдены у '+withAns+'.'+(noAns.length?' Без ответа: '+noAns.join(', ')+' — впишите ответ под задачей, иначе ученик будет решать её развёрнуто.':''):ansFrom?' Страницу с ответами нашёл, но разобрать ответы не получилось — впишите их вручную.':' Страницы «Ответы» в конце файла нет — впишите ответы вручную, если нужна автопроверка.')+' Проверьте ответы под задачами перед отправкой.');
 }catch(e){alert('Не получилось прочитать PDF: '+(e.message||e));tray()}
}

   el('a',{href:g.link,target:'_blank',rel:'noopener'},el('button',{className:'pri',textContent:g.me?'Подключить ещё устройство':'Подключить'}))));
  const au=el('input',{type:'checkbox',checked:g.auto});au.onchange=async()=>{const j=await post({t:'auto',on:au.checked});if(j.error){alert(j.error);au.checked=!au.checked}};
  d.b.append(el('label',{className:'row',style:'cursor:pointer'},au,el('span',{className:'grow',textContent:'Вечером (после 21:00) автоматически отправлять ученику и родителям PDF досок, на которых сегодня был урок'})));
 }else if(!g.owner)d.b.append(el('p',{textContent:'Бот ещё не подключён. Его подключает владелец сайта.'}));
 if(g.owner){
  const steps=el('ol',{style:'margin:0;padding-left:20px;line-height:1.6'});
  ['Откройте в Telegram бота @BotFather (с синей галочкой) и нажмите «Запустить».','Отправьте ему /newbot.','Придумайте имя, например «УчиДоска», затем адрес бота — латиницей, на конце bot, например uchidoska_help_bot.','BotFather пришлёт токен — длинную строку вида 123456789:AA…. Скопируйте её и вставьте в поле ниже. Никому её не пересылайте.'].forEach(t=>steps.append(el('li',{textContent:t})));
  const inp=el('input',{type:'password',placeholder:'Токен от @BotFather',autocomplete:'off'}),err=el('div',{className:'err'});
  const save=el('button',{className:'pri',textContent:g.on?'Заменить бота':'Подключить бота',onclick:async()=>{err.textContent='';save.disabled=true;const j=await post({t:'token',token:inp.value});save.disabled=false;if(j.error){err.textContent=j.error;return}d.close();alert('Готово! Бот @'+j.bot+' подключён.');$('tgb').click()}});
  d.b.append(el('b',{textContent:g.on?'Заменить бота (только владелец)':'Как подключить (один раз, 3 минуты)'}));
  if(!g.on)d.b.append(steps);
  d.b.append(inp,err,el('div',{className:'row'},save,g.on?el('button',{textContent:'Отключить бота',onclick:async()=>{if(confirm('Отключить бота? Уведомления перестанут приходить всем.')){await post({t:'token',token:''});d.close()}}}):null,el('button',{textContent:'Закрыть',onclick:d.close})));
 }else d.b.append(el('div',{className:'row'},el('button',{textContent:'Закрыть',onclick:d.close})));
};

window.hwTgRow=async(box,sid)=>{

 const st=g.subs.filter(x=>x.who==='s').length,pa=g.subs.filter(x=>x.who==='p').length;

 box.append(el('span',{className:'grow',textContent:'Telegram: ученик '+(st?'✅':'— не подключён')+' · родители: '+(pa||'нет')}),copyBtn('Ссылка ученику',g.s),copyBtn('Ссылка родителям',g.p));

// --- конспект урока ---
function askPdf(){return new Promise((ok,bad)=>{const f=$('fr');const h=e=>{if(e.origin!==location.origin||!e.data||e.data.t!=='pdfres')return;removeEventListener('message',h);clearTimeout(t);e.data.err?bad():ok(e.data)};
 const t=setTimeout(()=>{removeEventListener('message',h);bad()},60000);addEventListener('message',h);f.contentWindow.postMessage({t:'pdfreq'},location.origin)})}
$('tgs').onclick=async()=>{
 const sid=C().cur();if(!sid){alert('Сначала выберите ученика слева');return}
 const s=C().students().find(x=>x.id===sid),d=dlg('Конспект урока: '+s.name);
 const [gr,hr]=await Promise.all([api('/api/admin/tg-student?s='+sid),api('/api/admin/hw?s='+sid)]);const g=gr.ok?await gr.json():{},H=hr.ok?await hr.json():[];
 if(!g.on||!g.subs||!g.subs.length){
  d.b.append(el('p',{textContent:g.on?'Ни ученик, ни родители ещё не подключили Telegram. Отправьте им ссылки — после этого конспекты можно будет присылать одной кнопкой.':'Telegram-бот ещё не подключён: кнопка «Telegram» внизу слева.'}));
  if(g.on)d.b.append(el('div',{className:'row'},copyBtn('Ссылка ученику',g.s),copyBtn('Ссылка родителям',g.p)));
  d.b.append(el('div',{className:'row'},el('button',{textContent:'Закрыть',onclick:d.close})));return}
 const day=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'}),hw=H.find(h=>h.st==='new');
 const ta=el('textarea',{style:'min-height:150px',value:'📝 Урок '+day+'\nЧто прошли: \n'+(hw?'Домашка: «'+hw.title+'»'+(hw.due?' — до '+new Date(hw.due).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}):'')+' (в кабинете ученика)':'')});
 const pdf=el('input',{type:'checkbox',checked:true}),err=el('div',{className:'err'});
 const who=g.subs.map(x=>(x.who==='s'?'ученик':'родитель')+(x.name?' ('+x.name+')':'')).join(', ');
 const go=el('button',{className:'pri',textContent:'Отправить',onclick:async()=>{
  go.disabled=true;err.textContent='';go.textContent='Готовлю…';let p=null;
  if(pdf.checked){try{p=await askPdf()}catch(e){err.textContent='Не получилось сделать PDF доски';go.disabled=false;go.textContent='Отправить';return}}
  go.textContent='Отправляю…';
  const j=await post({t:'send',s:sid,text:ta.value,pdf:p&&p.b64,fname:p&&p.fname,page:p&&p.page});
  go.disabled=false;go.textContent='Отправить';if(j.error){err.textContent=j.error;return}
  d.close();alert('Конспект отправлен ('+j.sent+')')}});
 d.b.append(el('p',{className:'mut',textContent:'Получат: '+who}),ta,el('label',{style:'display:flex;gap:8px;align-items:center'},pdf,el('span',{textContent:'Приложить открытую доску (PDF)'})),err,
  el('div',{className:'row'},go,el('button',{textContent:'Отмена',onclick:d.close})));
 ta.focus();ta.setSelectionRange(ta.value.indexOf('Что прошли: ')+12,ta.value.indexOf('Что прошли: ')+12);
};
})();

// iPad + Apple Pencil: при нажатии стилус чуть сдвигается, и Safari иногда не засчитывает нажатие кнопки.
// Если после касания стилусом кнопка так и не сработала — нажимаем её сами.
(function(){let pd=null;
 document.addEventListener('pointerdown',e=>{pd=null;if(e.pointerType!=='pen')return;const b=e.target.closest&&e.target.closest('button,label,a,[role=button]');if(b&&!b.disabled)pd={b,x:e.clientX,y:e.clientY,t:Date.now()}},true);
 document.addEventListener('pointerup',e=>{if(!pd||e.pointerType!=='pen')return;const p=pd;pd=null;
  if(Date.now()-p.t>800||Math.hypot(e.clientX-p.x,e.clientY-p.y)>24)return;
  const b=e.target.closest&&e.target.closest('button,label,a,[role=button]');if(b!==p.b)return;
  let ok=false;const on=()=>{ok=true};b.addEventListener('click',on,{once:true,capture:true});
  setTimeout(()=>{b.removeEventListener('click',on,true);if(!ok&&document.contains(b)&&!b.disabled)b.click()},150)},true);
})();
