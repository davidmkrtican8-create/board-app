<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="УчиДоска">
<title>Кабинет преподавателя</title>
<style>
:root{--bg:#f4f1fa;--panel:#fff;--tx:#201c2b;--mut:#6b6580;--ac:#6a3fc4;--bd:#ddd6ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--panel:#221e2e;--tx:#ece8f5;--mut:#9a93b0;--ac:#a98bf0;--bd:#3a3450}}
:root[data-theme="dark"]{--bg:#17141f;--panel:#221e2e;--tx:#ece8f5;--mut:#9a93b0;--ac:#a98bf0;--bd:#3a3450}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}input,textarea{-webkit-user-select:text;user-select:text}
body.admfocus #side{display:none}
body.admfocus #bar>*:not(.keep){display:none}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
#login{max-width:420px;margin:10vh auto;padding:0 18px}
#lf{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:22px}
#lf h1{margin:0;font-size:22px}#lf .lead{margin:0 0 6px;color:var(--mut)}
#lf label{font-weight:600}#lf label.chk{font-weight:400;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:14px}
#lf input[type=password],#lf input[type=text]#pw{padding:12px;font-size:16px}
#pw{padding:12px;font-size:16px}
#go{padding:12px;font-size:16px;background:var(--ac);color:#fff;border-color:var(--ac)}
#msg{min-height:20px}#msg.err{color:#d32f2f}
#lf details{color:var(--mut);font-size:14px}#lf summary{cursor:pointer}#lf details p{margin:8px 0 0}
#app{height:100%;display:flex}
#app[hidden],#login[hidden],#lf [hidden]{display:none}
#side{width:250px;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:10px;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.st{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer}
.st.on{background:color-mix(in srgb,var(--ac) 16%,transparent)}
.dot{width:8px;height:22px;border-radius:4px;flex:none}
.foot{display:flex;gap:6px;flex-wrap:wrap}.foot button{font-size:13px;padding:5px 8px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:flex;gap:6px;align-items:center;padding:8px 10px;flex-wrap:wrap}#nm{flex:1;min-width:120px;font-size:17px}
#work{flex:1;display:flex;min-height:0;position:relative}
#work iframe{flex:1;min-width:0;border:0;min-height:0}
#tasks{width:470px;max-width:60%;border-left:1px solid var(--bd);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#tasks[hidden]{display:none}
.tr{display:flex;gap:6px;align-items:center;padding:6px 8px;flex-wrap:wrap}
.tr select{max-width:190px;font-size:13px}.tr button,.tr input{font-size:13px}
#tnum{width:64px}
#tview{flex:1;min-height:0;overflow:auto;background:#cfc9de;padding:3px}
#tbox{position:relative;margin:0 auto;background:#fff}
#tcv{display:block}
#tov{position:absolute;inset:0;touch-action:pan-y pinch-zoom;cursor:crosshair}
.card{position:absolute;border:2px solid transparent;border-radius:6px;pointer-events:none}
.card.hot{border-color:var(--ac);background:rgba(106,63,196,.07)}
.plus{position:absolute;width:30px;height:30px;border-radius:50%;padding:0;background:#2e7d32;color:#fff;border-color:#2e7d32;font-size:20px;line-height:1;cursor:pointer}
.lk{position:absolute;cursor:pointer;border-radius:4px}.lk:hover{outline:2px solid rgba(106,63,196,.55)}
.mk{position:absolute;left:0;right:0;height:3px;background:#d32f2f;pointer-events:none}
.sel{position:absolute;border:2px dashed #6a3fc4;background:rgba(106,63,196,.12);pointer-events:none}
.selbar{position:absolute;display:flex;gap:6px;z-index:3}
@media (max-width:700px){#tasks{position:absolute;inset:0;width:auto;max-width:none;z-index:5;border-left:0}}
#msg{color:var(--mut)}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg>div{background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dlg h2{margin:0;font-size:18px}.dlg .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--bd)}
.dlg .row .grow{flex:1;min-width:160px}.dlg .mut{color:var(--mut);font-size:13px}.dlg input{width:100%;padding:9px;font-size:15px}
.dlg .pri,#lf .pri{background:var(--ac);color:#fff;border-color:var(--ac)}.dlg .err{color:#d32f2f;min-height:18px}
.dlg code{font-size:12px;word-break:break-all;background:color-mix(in srgb,var(--ac) 10%,transparent);padding:4px 6px;border-radius:6px}
body.nosidebar #side{display:none}
.badge{background:#d32f2f;color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:auto}
#hwkn:not(:empty){background:#d32f2f;color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:6px}
.dlg>div.wide{max-width:920px}
.hwplus{width:auto;padding:0 8px;font-size:12px;border-radius:15px;background:var(--ac);border-color:var(--ac)}
#hwtray{border-top:2px solid var(--ac);background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-height:46%;min-height:0}
#hwtray[hidden]{display:none}
#hwtray .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#hwtray .r input{font-size:14px}
#hwtray .hint{font-size:12px;color:var(--mut)}
#hwcards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;min-height:0}
.hc{flex:none;width:190px;border:1px solid var(--bd);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:5px;font-size:13px;position:relative}
.hc img{width:100%;height:84px;object-fit:contain;background:#fff;border-radius:6px}
.hc .tx{height:84px;overflow:auto;white-space:pre-wrap;background:color-mix(in srgb,var(--ac) 6%,transparent);border-radius:6px;padding:4px}
.hc select,.hc input{font-size:13px;padding:4px 6px;width:100%}
.hc .x{position:absolute;top:2px;right:2px;padding:0 7px;border-radius:12px;font-size:13px}
.hwi{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}.hwi .grow{flex:1;min-width:180px}
.chip{font-size:12px;padding:2px 9px;border-radius:12px;background:color-mix(in srgb,var(--ac) 12%,transparent);white-space:nowrap}
.chip.sent{background:#d32f2f;color:#fff}.chip.checked{background:color-mix(in srgb,#2e7d32 18%,transparent)}
.ct{border:1px solid var(--bd);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.ct img{max-width:100%;max-height:260px;object-fit:contain;align-self:flex-start;background:#fff;border-radius:6px;cursor:zoom-in}
.ct .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mk2{padding:4px 12px}.mk2.on.y{background:#2e7d32;border-color:#2e7d32;color:#fff}.mk2.on.n{background:#d32f2f;border-color:#d32f2f;color:#fff}
.ok{color:#2e7d32;font-weight:600}.no{color:#d32f2f;font-weight:600}
.phs{display:flex;gap:8px;flex-wrap:wrap}.phs img{width:110px;height:140px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:zoom-in}
.dlg textarea{width:100%;min-height:70px;font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:8px}
@media (max-width:700px){#app{flex-direction:column}#side{width:100%;max-height:34%;border-right:0;border-bottom:1px solid var(--bd)}}
</style>
</head>
<body>
<div id="login" hidden>
 <form id="lf" autocomplete="on">
  <h1 id="lh">Вход для преподавателя</h1>
  <p class="lead" id="ll">Здесь вы создаёте личные доски для учеников и открываете их.</p>
  <label for="rn" class="reg" hidden>Ваше имя</label>
  <input id="rn" class="reg" hidden autocomplete="name" placeholder="Например, Анна Сергеевна" maxlength="60">
  <label for="lg">Логин</label>
  <input id="lg" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Логин" autofocus>
  <label for="pw">Пароль</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Пароль">
  <label for="pw2" class="reg" hidden>Пароль ещё раз</label>
  <input id="pw2" class="reg" hidden type="password" autocomplete="new-password" placeholder="Повторите пароль">
  <label class="chk"><input type="checkbox" id="showpw"> Показать пароль</label>
  <button id="go" type="submit">Войти</button>
  <div id="msg" role="alert"></div>
  <details id="lhelp">
   <summary>Забыли пароль?</summary>
   <p>Напишите владельцу сайта: он выдаст вам новый пароль.</p>
   <p>Ученикам пароль не нужен: они открывают только свою личную ссылку.</p>
  </details>
 </form>
</div>
<div id="app" hidden>
 <div id="side">
  <div class="top"><b>Ученики</b><button id="addS">+ Ученик</button></div>
  <div id="list"></div>
  <div id="whoami" style="font-size:12px;color:var(--mut)"></div>
  <div class="foot"><button id="tch" hidden title="Пригласить репетиторов и управлять их аккаунтами">Репетиторы</button><button id="tgb" title="Telegram-бот: уведомления и конспекты">Telegram</button><button id="cpw" title="Сменить свой пароль">Пароль</button><button id="bk">Скачать копию</button><button id="rs">Загрузить копию</button><input type="file" id="rf" accept=".json" hidden><button id="lo" title="Выйти из кабинета на этом устройстве">Выйти</button><button id="rb" title="Вернуть учеников и доски из копии, которую кабинет сам сохраняет в вашем браузере">Восстановить из автокопии</button><div id="bkst" style="font-size:12px;color:var(--mut);width:100%"></div></div>
 </div>
 <div id="main">
  <div id="bar"><button id="hs" title="Скрыть или показать список учеников">◧</button><b id="nm">Выберите ученика</b><button id="tk" class="keep">Задачи</button><button id="hwk" title="Домашние задания ученика">Домашка<span id="hwkn"></span></button><button id="tgs" title="Отправить конспект урока ученику и родителям в Telegram">📨 Конспект</button><button id="fs" class="keep" title="Фокус: убрать панели">⛶</button><button id="fsb" class="keep" title="Во весь экран (Esc — выйти)">⤢</button><button id="th" class="keep" title="Тема: как в системе / светлая / тёмная">◐</button><button id="lnk">Ссылка ученика</button><button id="ren">Переименовать</button><button id="del">Удалить</button></div>
  <div id="work">
   <iframe id="fr" allow="microphone; camera; autoplay; clipboard-write"></iframe>
   <div id="tasks" hidden>
    <div class="tr"><select id="tbook"></select><button id="tadd">+ Сборник</button><button id="tdel" title="Убрать сборник из списка">Убрать</button><input type="file" id="tfile" accept=".pdf,application/pdf" multiple hidden><button id="tclose" style="margin-left:auto">✕</button></div>
    <div class="tr"><button id="tback" title="Назад">↩</button><button id="tprev">←</button><input id="tnum" type="number" min="1"><span id="tcnt"></span><button id="tnext">→</button><select id="tol"><option value="">Оглавление…</option></select></div>
    <div class="tr"><input id="tq" placeholder="Номер задачи, например 4.19" style="flex:1;min-width:120px"><button id="tfind">Найти</button><button id="tpage">Страница целиком → на доску</button></div>
    <div class="tr" style="padding-top:0"><select id="tgap" title="Сколько свободного места оставлять под решением между задачами"><option value="120">Место под решение: мало</option><option value="350">Место под решение: среднее</option><option value="600">Место под решение: много</option></select><span id="tmsg" style="font-size:12px;color:var(--mut)"></span></div>
    <div id="tview"><div id="tbox"><canvas id="tcv"></canvas><div id="tov"></div></div></div>
   </div>
  </div>
  <div id="hwtray" hidden></div>
 </div>
</div>
<script>
(function(){
const $=i=>document.getElementById(i);
let tok=localStorage.getItem('tok')||'',students=[],cur=null,me=null,regMode=false;
const invite=new URLSearchParams(location.search).get('invite');
const api=window.boardApi=(p,o)=>fetch(p,Object.assign({},o,{headers:{'X-Token':tok,'Content-Type':'application/json'}}));
const post=(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
function setTok(j){tok=j.token;localStorage.setItem('tok',tok);if(j.login)localStorage.setItem('tlogin',j.login)}
function setReg(on){regMode=on;document.querySelectorAll('#lf .reg').forEach(e=>e.hidden=!on);
 $('lh').textContent=on?'Регистрация преподавателя':'Вход для преподавателя';
 $('ll').textContent=on?'Вас пригласили на доску. Придумайте логин и пароль — с ними вы будете входить в свой кабинет.':'Здесь вы создаёте личные доски для учеников и открываете их.';
 $('go').textContent=on?'Создать аккаунт':'Войти';$('pw').autocomplete=on?'new-password':'current-password';$('lhelp').hidden=on}
function showLogin(t,bad){$('app').hidden=true;$('login').hidden=false;$('msg').textContent=t||'';$('msg').className=bad?'err':'';$('go').disabled=false;(regMode?$('rn'):$('lg')).focus()}
async function load(){
 const r=await api('/api/admin/me');
 if(r.status===503)return showLogin('На сервере не задан пароль владельца (ADMIN_KEY).',true);
 if(r.status===401){const had=!!tok;tok='';localStorage.removeItem('tok');return showLogin(had?'Вход устарел или пароль сменили. Войдите снова.':'',had)}
 me=await r.json();localStorage.setItem('tlogin',me.login);
 students=await (await api('/api/admin/students')).json();
 $('login').hidden=true;$('app').hidden=false;$('tch').hidden=me.role!=='owner';$('whoami').textContent='Вы вошли как '+me.name+' ('+me.login+')';render();
 const last=localStorage.getItem('last:'+me.login);
 if(!cur&&students.length)pick(students.some(s=>s.id===last)?last:students[0].id);
}
function render(){const l=$('list');l.innerHTML='';
 if(!students.length){const d=document.createElement('div');d.className='st';d.style.color='var(--mut)';d.textContent='Пока нет учеников. Нажмите «+ Ученик».';l.appendChild(d)}
 students.forEach(s=>{const d=document.createElement('div');d.className='st'+(s.id===cur?' on':'');
  const dot=document.createElement('span');dot.className='dot';dot.style.background=s.color;
  const t=document.createElement('span');t.textContent=s.name;d.append(dot,t);
  const pn=(window.hwPend||{})[s.id];if(pn){const b=document.createElement('span');b.className='badge';b.textContent=pn;b.title='Домашек ждут проверки: '+pn;d.append(b)}
  d.onclick=()=>pick(s.id);l.appendChild(d)});if(window.hwOnPick)window.hwOnPick()}
function pick(id,hash){cur=id;if(me)localStorage.setItem('last:'+me.login,id);const s=students.filter(x=>x.id===id)[0];
 if(!s){cur=null;$('nm').textContent='Выберите ученика';$('fr').src='about:blank';render();return}
 $('nm').textContent=s.name;render();
 const f=$('fr'),prev=f.getAttribute('src')||'';
 if(!prev.startsWith('/b/')||prev.split(/[/#]/)[2]===id){f.src='/b/'+id+(hash||'');return}
 // перед сменой ученика доска сохраняет снимок для вечернего конспекта (не дольше 4 с)
 let done=false;const go=()=>{if(done)return;done=true;removeEventListener('message',h);if(cur===id)f.src='/b/'+id+(hash||'')};
 const h=e=>{if(e.origin===location.origin&&e.data&&e.data.t==='snapdone')go()};addEventListener('message',h);setTimeout(go,4000);
 try{f.contentWindow.postMessage({t:'snapnow'},location.origin)}catch(e){go()}}
window.hwCtx={cur:()=>cur,students:()=>students,render:()=>render(),open:(id,hash)=>pick(id,hash)};
async function op(o){const r=await api('/api/admin/op',{method:'POST',body:JSON.stringify(o)});
 const j=r.ok?await r.json():null;if(!j||j.error){alert(j&&j.error||'Не получилось');return false}
 if(Array.isArray(j))students=j;render();return j}
$('lf').onsubmit=async e=>{e.preventDefault();
 const login=$('lg').value.trim().toLowerCase(),pw=$('pw').value;$('msg').className='';
 if(regMode){
  const name=$('rn').value.trim();
  if(!name)return showLogin('Укажите имя',true);
  if(!/^[a-z0-9._-]{3,32}$/.test(login))return showLogin('Логин: от 3 до 32 латинских букв или цифр (можно . _ -)',true);
  if(pw.length<8)return showLogin('Пароль должен быть не короче 8 символов',true);
  if(pw!==$('pw2').value)return showLogin('Пароли не совпадают',true);
  $('go').disabled=true;$('msg').textContent='Создаю аккаунт…';
  const r=await post('/api/register',{code:invite,login,name,password:pw}),j=r.ok?await r.json():{error:r.status===429?'Слишком много попыток, подождите 10 минут':'Не получилось'};
  if(j.error)return showLogin(j.error,true);
  setTok(j);history.replaceState(null,'','/t');setReg(false);return load();
 }
 if(!login||!pw)return showLogin('Введите логин и пароль',true);
 $('go').disabled=true;$('msg').textContent='Проверяю…';
 const r=await post('/api/login',{login,password:pw});
 if(r.status===429)return showLogin('Слишком много попыток. Подождите 10 минут.',true);
 if(!r.ok)return showLogin('Неверный логин или пароль. Проверьте раскладку клавиатуры и большие/маленькие буквы.',true);
 setTok(await r.json());$('pw').value='';load()};
$('showpw').onchange=()=>{const t=$('showpw').checked?'text':'password';$('pw').type=t;$('pw2').type=t};
$('lo').onclick=()=>{if(confirm('Выйти из кабинета на этом устройстве? Автокопия досок останется.')){localStorage.removeItem('tok');location.reload()}};
$('addS').onclick=async()=>{const n=prompt('Имя ученика (можно с классом, например «Миша 8кл»):');if(!n||!n.trim())return;
 if(await op({t:'add',name:n}))pick(students[students.length-1].id)};
$('ren').onclick=async()=>{if(!cur)return;const s=students.filter(x=>x.id===cur)[0];const n=prompt('Новое имя:',s.name);if(!n||!n.trim())return;await op({t:'rename',id:cur,name:n});pick(cur)};
$('del').onclick=async()=>{if(!cur)return;const s=students.filter(x=>x.id===cur)[0];
 if(!confirm('Удалить ученика «'+s.name+'» вместе со всеми его досками? Это нельзя отменить.'))return;
 const id=cur;cur=null;await op({t:'delete',id:id});pick(students.length?students[0].id:null)};
$('lnk').onclick=()=>{if(!cur)return;const t=location.origin+'/b/'+cur;
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$('lnk').textContent='Скопировано';setTimeout(()=>{$('lnk').textContent='Ссылка ученика'},1500)},()=>prompt('Ссылка ученика:',t))};
$('bk').onclick=async()=>{const r=await api('/api/admin/backup');if(!r.ok)return alert('Не получилось');
 const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='board-backup-'+(me?me.login+'-':'')+new Date().toISOString().slice(0,10)+'.json';a.click()};
$('rs').onclick=()=>$('rf').click();
$('rf').onchange=async()=>{const f=$('rf').files[0];$('rf').value='';if(!f)return;
 if(!confirm('Загрузить копию? Ваш список учеников и их доски будут заменены данными из файла.'))return;
 try{const data=JSON.parse(await f.text());if(await op({t:'restore',data:data})){cur=null;pick(students.length?students[0].id:null)}}catch(e){alert('Файл не подходит')}};

// ---------- окна: смена пароля и панель владельца ----------
function dlg(title){const o=document.createElement('div');o.className='dlg';const b=document.createElement('div');
 const h=document.createElement('h2');h.textContent=title;b.appendChild(h);o.appendChild(b);
 o.addEventListener('pointerdown',e=>{if(e.target===o)o.remove()});document.body.appendChild(o);return{o,b,close:()=>o.remove()}}
const el=(tag,props,...kids)=>{const e=Object.assign(document.createElement(tag),props||{});kids.forEach(k=>e.append(k));return e};
$('cpw').onclick=()=>{const d=dlg('Сменить пароль');

<script>
// Сборники задач: PDF открывается прямо в браузере, файл остаётся на компьютере преподавателя
(function(){
const $=i=>document.getElementById(i);
let pdfjs=null,pdf=null,book=null,pageNo=1,hist=[],token=0,ol=[],inited=false,sel=null;
const mem=new Map();
const idb=()=>new Promise((res,rej)=>{try{const q=indexedDB.open('tasks-books',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
async function store(mode,fn){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
const bookKeys=async()=>{try{return await store('readonly',s=>s.getAllKeys())}catch(e){return [...mem.keys()]}};
const bookGet=async k=>{try{return await store('readonly',s=>s.get(k))}catch(e){return mem.get(k)}};
const bookPut=async(k,v)=>{try{await store('readwrite',s=>s.put(v,k))}catch(e){mem.set(k,v)}};
const bookDel=async k=>{try{await store('readwrite',s=>s.delete(k))}catch(e){mem.delete(k)}};
const msg=(t,ms)=>{$('tmsg').textContent=t;if(ms)setTimeout(()=>{if($('tmsg').textContent===t)$('tmsg').textContent=''},ms)};

// поиск карточек задач на странице (шапка карточки закрашена цветом, тело белое, между карточками фон)
function detect(oc){
 const w=oc.width,h=oc.height,d=oc.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
 const b0=(3*w+3)*4,bg=[d[b0],d[b0+1],d[b0+2]],xs=Math.floor(w*.105)+4,xe=xs+Math.max(8,Math.floor(w*.02)),ymax=Math.floor(h*.9),n=xe-xs;
 const HDR=new Uint8Array(h),ISBG=new Uint8Array(h);
 for(let y=0;y<h;y++){
  const mn=[255,255,255],mx=[0,0,0],sm=[0,0,0];
  for(let x=xs;x<xe;x++){const i=(y*w+x)*4;for(let c=0;c<3;c++){const v=d[i+c];if(v<mn[c])mn[c]=v;if(v>mx[c])mx[c]=v;sm[c]+=v}}
  const u=Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2])<=8,m=[sm[0]/n,sm[1]/n,sm[2]/n];
  const db=Math.abs(m[0]-bg[0])+Math.abs(m[1]-bg[1])+Math.abs(m[2]-bg[2]),mm=Math.min(m[0],m[1],m[2]);
  ISBG[y]=u&&db<14?1:0;
  HDR[y]=(y<ymax&&u&&db>=14&&mm<246&&!(mm>=248))?1:0;
 }
 const minh=Math.max(8,Math.floor(h*.012)),gapn=Math.max(3,Math.floor(h*.006)),bands=[];
 const anyH=(a,b)=>{for(let i=a;i<Math.min(b,h);i++)if(HDR[i])return true;return false};
 const allB=(a,b)=>{for(let i=a;i<Math.min(b,h);i++)if(!ISBG[i])return false;return true};
 for(let y=0;y<ymax;){
  if(HDR[y]){const s=y;while(y<ymax&&(HDR[y]||anyH(y,y+4)))y++;if(y-s>=minh)bands.push([s,y])}else y++;
 }
 const cards=[];let last=-1;
 for(const [s,e] of bands){if(s<last)continue;let y=e;while(y<ymax&&!allB(y,y+gapn))y++;cards.push([s,y]);last=y}
 return cards;
}
async function resolveDest(d){
 if(typeof d==='string')d=await pdf.getDestination(d);
 if(!Array.isArray(d))return null;
 const ref=d[0],idx=typeof ref==='object'?await pdf.getPageIndex(ref):ref;
 return{page:idx+1,y:(d[1]&&d[1].name==='XYZ'&&typeof d[3]==='number')?d[3]:null};
}
// ---------- ответ и номер задачи из сборника (сборники MathStart: у карточки есть кнопка «Ответ» — ссылка на страницу ответов) ----------
let leafCache=null;
async function bookLeaves(){ // разделы оглавления: страница начала, раздел верхнего уровня
 if(leafCache)return leafCache;const L=[];
 for(const top of (await pdf.getOutline())||[])for(const o of (top.items&&top.items.length?top.items:[top])){let p=null;try{const t=await resolveDest(o.dest);p=t&&t.page}catch(e){}L.push({top:String(top.title||''),p})}
 return(leafCache=L);
}
async function destXY(d){if(typeof d==='string')d=await pdf.getDestination(d);if(!Array.isArray(d))return null;return{page:(await pdf.getPageIndex(d[0]))+1,x:+d[2]||0,y:+d[3]||0}}
async function cardInfo(fy0,fy1){
 const pg=await pdf.getPage(pageNo),H=pg.getViewport({scale:1}).height,top=H*(1-fy0),bot=H*(1-fy1);
 const links=(await pg.getAnnotations()).filter(a=>a.subtype==='Link'&&a.dest&&a.rect[1]>=bot-2&&a.rect[3]<=top+2).sort((a,b)=>b.rect[0]-a.rect[0]);
 if(!links.length)return null;
 const A=links[0],t=await destXY(A.dest);if(!t)return null;
 const L=await bookLeaves(),out={};
 // номер: из имени ссылки «ans::4.19», из заголовка «Задача 4.19.», иначе по разделу оглавления (аналоги — через ссылку на прототип)
 const m=typeof A.dest==='string'&&A.dest.match(/^ans::(\d+)\./);
 let leafPage=pageNo;const lastP=Math.max(0,...L.map(l=>l.p||0));
 if(pageNo>lastP+20&&links[1]){const pr=await destXY(links[1].dest);if(pr)leafPage=pr.page}
 let li=-1;L.forEach((l,k)=>{if(l.p&&l.p<=leafPage)li=k});
 const ext=li>=0&&/РАЗВ[ЁЕ]РНУТ/i.test(L[li].top),prac=l=>/ПРАКТИЧ/i.test(l.top),hasPr=L.some(prac);
 if(m)out.num=+m[1];
 else{const tx=(await pg.getTextContent()).items.find(i=>/^(Задача|Аналог|Прототип)\s+\d+\./.test(i.str)&&i.transform[5]<=top+2&&i.transform[5]>=top-45);
  if(tx)out.num=+tx.str.match(/(\d+)\./)[1];
  else if(li>=0&&!prac(L[li]))out.num=L.slice(0,li).filter(l=>!prac(l)).length+(hasPr?6:1);}
 if(!(out.num>=1&&out.num<=19))delete out.num;
 // ответ: текст справа от номера на странице ответов (только простое число на одной строке)
 if(!ext){
  const tc=await (await pdf.getPage(t.page)).getTextContent();
  const it=tc.items.filter(i=>i.str.trim()&&i.transform[4]>t.x+30&&i.transform[4]<t.x+160&&i.transform[5]<=t.y+2&&i.transform[5]>=t.y-20).sort((a,b)=>a.transform[4]-b.transform[4]);
  const ys=it.map(i=>i.transform[5]),flat=ys.length&&Math.max(...ys)-Math.min(...ys)<2.5;
  const a=it.map(i=>i.str).join('').trim().replace(/\.$/,'').replace(/[↑−–]/g,'-').replace(/\s+/g,'');
  if(flat&&/^-?\d+([.,]\d+)?$/.test(a))out.ans=a;
 }
 return out;
}
function goto(p,y,push=true){
 if(!pdf)return;p=Math.max(1,Math.min(pdf.numPages,p|0));
 if(push&&p!==pageNo)hist.push(pageNo);
 pageNo=p;$('tnum').value=p;localStorage.setItem('tpos:'+book,p);render(y);
}
function clearSel(){if(sel){if(sel.el)sel.el.remove();if(sel.bar)sel.bar.remove();sel=null}}
async function render(markY){
 const my=++token,page=await pdf.getPage(pageNo);if(my!==token)return;
 const base=page.getViewport({scale:1}),cssW=Math.max(280,$('tview').clientWidth-6),k=cssW/base.width,dpr=Math.min(2,window.devicePixelRatio||1);
 const vp=page.getViewport({scale:k}),vpr=page.getViewport({scale:k*dpr}),cv=$('tcv'),ov=$('tov');
 cv.width=Math.round(vpr.width);cv.height=Math.round(vpr.height);cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';
 $('tbox').style.width=vp.width+'px';$('tbox').style.height=vp.height+'px';
 clearSel();ov.innerHTML='';
 await page.render({canvasContext:cv.getContext('2d'),viewport:vpr}).promise;if(my!==token)return;
 const dvp=page.getViewport({scale:500/base.width}),oc=document.createElement('canvas');
 oc.width=Math.round(dvp.width);oc.height=Math.round(dvp.height);
 await page.render({canvasContext:oc.getContext('2d',{willReadFrequently:true}),viewport:dvp}).promise;if(my!==token)return;
 detect(oc).forEach(([s,e])=>{
  const fy0=Math.max(0,(s-2)/oc.height),fy1=Math.min(1,(e+2)/oc.height),fx0=.095,fx1=.905;
  const c=document.createElement('div');c.className='card';
  c.style.cssText='left:'+fx0*100+'%;width:'+(fx1-fx0)*100+'%;top:'+fy0*100+'%;height:'+(fy1-fy0)*100+'%';
  const b=document.createElement('button');b.className='plus';b.textContent='+';b.title='Отправить эту задачу на доску';
  b.style.cssText='top:'+fy0*100+'%;left:1%';
  b.onmouseenter=()=>c.classList.add('hot');b.onmouseleave=()=>c.classList.remove('hot');
  b.onclick=()=>send(fx0-.005,fy0,fx1+.005,fy1,b);
  ov.append(c,b);
  if(window.hwDraft){const z=document.createElement('button');z.className='plus hwplus';z.textContent='+ ДЗ';z.title='Добавить эту задачу в домашку';z.style.cssText='top:calc('+fy0*100+'% + 34px);left:1%';
   z.onclick=async()=>{z.textContent='…';try{const [src,info]=await Promise.all([crop(fx0-.005,fy0,fx1+.005,fy1),cardInfo(fy0,fy1).catch(()=>null)]);window.hwAdd(src,info);z.textContent='✓'}catch(e){z.textContent='+ ДЗ'}};ov.append(z)}
 });
 for(const a of await page.getAnnotations()){
  if(a.subtype!=='Link'||!a.dest)continue;
  const p1=vp.convertToViewportPoint(a.rect[0],a.rect[1]),p2=vp.convertToViewportPoint(a.rect[2],a.rect[3]),l=document.createElement('div');
  l.className='lk';l.style.cssText='left:'+Math.min(p1[0],p2[0])+'px;top:'+Math.min(p1[1],p2[1])+'px;width:'+Math.abs(p2[0]-p1[0])+'px;height:'+Math.abs(p2[1]-p1[1])+'px';
  l.onpointerdown=e=>e.stopPropagation();
  l.onclick=async()=>{const t=await resolveDest(a.dest);if(t)goto(t.page,t.y)};
  ov.appendChild(l);
 }
 const sc=$('tview');
 if(markY!=null){const y=vp.convertToViewportPoint(0,markY)[1],m=document.createElement('div');m.className='mk';m.style.top=y+'px';ov.appendChild(m);sc.scrollTop=Math.max(0,y-70);setTimeout(()=>m.remove(),5000)}
 else sc.scrollTop=0;
}
async function crop(fx0,fy0,fx1,fy1){
 const page=await pdf.getPage(pageNo),base=page.getViewport({scale:1});
 const sc=Math.max(1,Math.min(4,1100/((fx1-fx0)*base.width))),vp=page.getViewport({scale:sc});
 const full=document.createElement('canvas');full.width=Math.round(vp.width);full.height=Math.round(vp.height);
 await page.render({canvasContext:full.getContext('2d'),viewport:vp}).promise;
 const x=Math.round(fx0*full.width),y=Math.round(fy0*full.height),w=Math.round((fx1-fx0)*full.width),h=Math.round((fy1-fy0)*full.height);
 const o=document.createElement('canvas');o.width=w;o.height=h;const c=o.getContext('2d');
 c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(full,x,y,w,h,0,0,w,h);
 let s=o.toDataURL('image/png');if(s.length>700000)s=o.toDataURL('image/jpeg',.9);
 return s;
}
async function send(fx0,fy0,fx1,fy1,btn){
 const f=$('fr');
 if(!(f.getAttribute('src')||'').startsWith('/b/')){msg('Сначала выберите ученика слева',4000);return}
 msg('Отправляю…');
 try{
  f.contentWindow.postMessage({t:'task',src:await crop(fx0,fy0,fx1,fy1),gap:+$('tgap').value},location.origin);
  msg('✓ Задача на доске',2500);
  if(btn){const o=btn.textContent;btn.textContent='✓';setTimeout(()=>{btn.textContent=o},1500)}
 }catch(e){msg('Не получилось: '+(e.message||e),4000)}
}
async function openBook(name){
 msg('Открываю сборник…');
 try{
  if(!pdfjs){pdfjs=await import('/pdfjs/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='/pdfjs/pdf.worker.min.mjs'}
  const blob=await bookGet(name);if(!blob){msg('Сборник не найден');return}
  if(pdf){try{pdf.destroy()}catch(e){}}
  pdf=await pdfjs.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
  book=name;leafCache=null;localStorage.setItem('tbook',name);hist=[];$('tcnt').textContent='/ '+pdf.numPages;
  ol=[];(function w(a,d){for(const o of a||[]){ol.push({t:o.title,d:o.dest,depth:d});w(o.items,d+1)}})(await pdf.getOutline(),0);
  const s=$('tol');s.innerHTML='<option value="">Оглавление…</option>';
  ol.forEach((o,i)=>{const e=document.createElement('option');e.value=i;e.textContent='\u2003'.repeat(o.depth)+o.t;s.appendChild(e)});
  msg('');goto(Math.min(pdf.numPages,+localStorage.getItem('tpos:'+name)||1),null,false);
 }catch(e){msg('Не удалось открыть сборник: '+(e.message||e))}
}
async function refresh(want){
 const ks=await bookKeys(),s=$('tbook');s.innerHTML='';
 ks.forEach(k=>{const o=document.createElement('option');o.value=o.textContent=k;s.appendChild(o)});
 if(!ks.length){pdf=null;book=null;$('tov').innerHTML='';$('tbox').style.height='0';$('tcnt').textContent='';msg('Добавьте сборник (PDF) кнопкой «+ Сборник». Файл останется на вашем компьютере.');return}

}
async function findTask(){
 const q=$('tq').value.trim().replace(',','.');if(!q||!pdf)return;
 for(const n of ['task::'+q,'task::'+q+'.1']){
  let d=null;try{d=await pdf.getDestination(n)}catch(e){}
  if(d){const t=await resolveDest(d);if(t){goto(t.page,t.y);return}}
 }
 msg('Задача '+q+' не найдена. Поиск по номеру работает не во всех сборниках, используйте оглавление.',5000);
}
// выделение произвольной области мышью или пером
const ov=$('tov');
ov.addEventListener('pointerdown',e=>{
 if(e.target!==ov||e.pointerType==='touch')return;
 clearSel();const r=ov.getBoundingClientRect(),d=document.createElement('div');d.className='sel';ov.appendChild(d);
 sel={el:d,r:r,x:e.clientX-r.left,y:e.clientY-r.top};sel.x1=sel.x;sel.y1=sel.y;ov.setPointerCapture(e.pointerId);
});
ov.addEventListener('pointermove',e=>{
 if(!sel||!sel.el||sel.bar)return;
 sel.x1=Math.max(0,Math.min(sel.r.width,e.clientX-sel.r.left));sel.y1=Math.max(0,Math.min(sel.r.height,e.clientY-sel.r.top));
 Object.assign(sel.el.style,{left:Math.min(sel.x,sel.x1)+'px',top:Math.min(sel.y,sel.y1)+'px',width:Math.abs(sel.x1-sel.x)+'px',height:Math.abs(sel.y1-sel.y)+'px'});
});
ov.addEventListener('pointerup',()=>{
 if(!sel||!sel.el||sel.bar)return;
 const x0=Math.min(sel.x,sel.x1),x1=Math.max(sel.x,sel.x1),y0=Math.min(sel.y,sel.y1),y1=Math.max(sel.y,sel.y1);
 if(x1-x0<20||y1-y0<20){clearSel();return}
 const bar=document.createElement('div');bar.className='selbar';bar.style.left=x0+'px';bar.style.top=Math.min(y1+4,sel.r.height-36)+'px';
 const ok=document.createElement('button'),no=document.createElement('button');

<script>
// Вид кабинета и автокопия
(function(){
const $=i=>document.getElementById(i);
function setSB(h){document.body.classList.toggle('nosidebar',h);localStorage.setItem('nosidebar',h?'1':'0')}
$('hs').onclick=()=>setSB(!document.body.classList.contains('nosidebar'));
if(localStorage.getItem('nosidebar')==='1')setSB(true);
// «фокус»: убирает боковые панели (встроенный полный экран Safari ломает клавиатуру, поэтому без него)
$('fs').onclick=()=>document.body.classList.toggle('admfocus');
// настоящий полный экран (кнопка ⤢): вместе с ним включается «фокус»; выход — Esc или ещё раз ⤢
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement,de=document.documentElement;
$('fsb').onclick=()=>{
 if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
 if(de.requestFullscreen)de.requestFullscreen().catch(()=>{});else de.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
};
const onFs=()=>{document.body.classList.toggle('admfocus',!!fsEl());$('fsb').textContent=fsEl()?'⤡':'⤢'};
document.addEventListener('fullscreenchange',onFs);document.addEventListener('webkitfullscreenchange',onFs);
if(!(de.requestFullscreen||de.webkitRequestFullscreen))$('fsb').hidden=true;
// iPad: в полноэкранном режиме не даём Safari прокрутить страницу (иначе он выходит из полного экрана); прокручиваемые списки работают
document.addEventListener('touchmove',e=>{
 if(!fsEl())return;
 for(let n=e.target;n&&n!==document.body;n=n.parentElement){if(n.scrollHeight>n.clientHeight+2&&/(auto|scroll)/.test(getComputedStyle(n).overflowY))return;if(n.tagName==='INPUT')return}
 e.preventDefault();
},{passive:false});
if('ontouchstart' in window)['gesturestart','gesturechange'].forEach(n=>document.addEventListener(n,e=>{if(fsEl())e.preventDefault()}));
// тема кабинета и доски
let th=localStorage.getItem('admtheme')||'auto';
function applyTh(){document.documentElement.dataset.theme=th==='auto'?'':th;try{$('fr').contentWindow.postMessage({t:'theme',v:th},location.origin)}catch(e){}}
$('th').onclick=()=>{th=th==='auto'?'dark':th==='dark'?'light':'auto';localStorage.setItem('admtheme',th);applyTh();$('th').title='Тема: '+({auto:'как в системе',dark:'тёмная',light:'светлая'})[th]};
$('fr').addEventListener('load',()=>{if(th!=='auto')applyTh()});
applyTh();
// Cmd/Ctrl+Z, когда фокус не в доске: передаём в доску, а не в браузер (иначе Safari «возвращает закрытую вкладку»)
window.addEventListener('keydown',e=>{
 if(!(e.metaKey||e.ctrlKey)||!(e.code==='KeyZ'||e.code==='KeyY'))return;
 const x=document.activeElement;if(x&&(x.tagName==='TEXTAREA'||(x.tagName==='INPUT'&&/^(text|number|search|password)$/i.test(x.type||'text'))))return;
 const f=$('fr');if(!(f.getAttribute('src')||'').startsWith('/b/'))return;
 e.preventDefault();f.contentWindow.postMessage({t:'key',a:(e.code==='KeyY'||e.shiftKey)?'redo':'undo'},location.origin);
},true);

// быстрые клавиши доски (V стрелка, E ластик, P перо, H маркер, L указка, Delete, Esc), когда фокус в кабинете, а не в доске
window.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey||!/^(Key[VEPBHL]|Delete|Escape)$/.test(e.code))return;
 const x=document.activeElement;if(x&&(x.tagName==='TEXTAREA'||x.tagName==='INPUT'||x.tagName==='SELECT'||x.isContentEditable))return;

 e.preventDefault();f.contentWindow.postMessage({t:'hotkey',code:e.code,key:e.key},location.origin);
},true);
// ⌘V, когда фокус в кабинете (например, после клика по ученику): картинку передаём в доску
const isInp=x=>!!x&&(x.tagName==='TEXTAREA'||(x.tagName==='INPUT'&&/^(text|number|search|password|email|url|tel)$/i.test(x.type||'text')));
const boardOpen=()=>($('fr').getAttribute('src')||'').startsWith('/b/');
document.addEventListener('paste',e=>{
 const dt=e.clipboardData,a=document.activeElement;if(!dt||!boardOpen())return;
 if(isInp(a)&&dt.getData('text/plain'))return;
 let f=null;const it=dt.items||[];
 for(let i=0;i<it.length&&!f;i++)if(it[i].kind==='file'&&/^image\//.test(it[i].type))f=it[i].getAsFile();
 if(!f)for(const x of (dt.files||[]))if(/^image\/|\.(heic|heif)$/i.test(x.type||x.name)){f=x;break}
 if(!f)return;e.preventDefault();if(a&&a!==document.body)a.blur();
 if(window.hwDraft&&window.hwAddFile){window.hwAddFile(f);return} // собираем домашку
 const r=new FileReader();r.onload=()=>{$('fr').contentWindow.postMessage({t:'pasteimg',src:r.result,heic:/heic|heif/i.test(f.type+' '+(f.name||''))},location.origin);$('fr').focus()};r.readAsDataURL(f);
},true);
// Safari присылает «вставку», только если фокус в поле ввода: на ⌘V подставляем невидимое поле
const pcatch=document.createElement('div');pcatch.contentEditable='true';pcatch.setAttribute('aria-hidden','true');
pcatch.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;overflow:hidden';document.body.appendChild(pcatch);
pcatch.addEventListener('input',()=>{pcatch.textContent=''});
window.addEventListener('keydown',e=>{
 if(!(e.metaKey||e.ctrlKey)||e.code!=='KeyV'||!boardOpen())return;const a=document.activeElement;
 if(isInp(a)||a===pcatch||(a&&a.isContentEditable))return;
 pcatch.focus({preventScroll:true});setTimeout(()=>{pcatch.textContent='';if(document.activeElement===pcatch)pcatch.blur()},300);
},true);

// Копия всех досок хранится в браузере преподавателя: если сервер потеряет данные (обновление файлов на GitHub), их можно вернуть
const api=(p,o)=>window.boardApi(p,o);
const bkey=k=>k+':'+(localStorage.getItem('tlogin')||'admin');
const bdb=()=>new Promise((res,rej)=>{try{const q=indexedDB.open('board-backups',1);q.onupgradeneeded=()=>q.result.createObjectStore('b');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
async function bget(k){const db=await bdb();const v=await bget0(db,bkey(k));if(v||localStorage.getItem('tlogin')!=='admin')return v;return bget0(db,k)} // старые копии владельца лежат без логина
async function bget0(db,k){return new Promise((res,rej)=>{const q=db.transaction('b').objectStore('b').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function bput(k,v){const db=await bdb();return new Promise((res,rej)=>{const t=db.transaction('b','readwrite');t.objectStore('b').put(v,bkey(k));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
const fmt=t=>new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
async function serverCount(){const r=await api('/api/admin/students');return r.ok?(await r.json()).length:-1}
async function makeBackup(){
 try{
  if(await serverCount()<1)return; // пустой сервер не затирает копию
  const r=await api('/api/admin/backup');if(!r.ok)return;
  const data=await r.json(),now=Date.now(),cur=await bget('latest'),day=await bget('daily');
  if(cur&&(!day||now-day.t>20*3600e3))await bput('daily',cur);
  await bput('latest',{t:now,data:data});

 }catch(e){$('bkst').textContent='Автокопия не сохранилась'}

 if(r.ok)location.reload();else alert('Не получилось восстановить');

 for(const k of ['latest','daily']){
  const b=await bget(k).catch(()=>null);if(!b)continue;
  if(confirm('Восстановить из '+(k==='latest'?'последней':'суточной')+' автокопии от '+fmt(b.t)+' (учеников: '+b.data.index.students.length+')? Недостающие ученики и доски вернутся, текущие останутся как есть.'))return restore(b);

}
$('rb').onclick=manualRestore;
async function start(){
 const n=await serverCount();if(n<0)return;
 const b=await bget('latest').catch(()=>null);
 if(n===0&&b&&b.data.index.students.length){
  if(confirm('На сервере пусто (так бывает после обновления файлов на GitHub). Вернуть учеников и доски из автокопии от '+fmt(b.t)+'?'))return restore(b);
  $('bkst').textContent='Есть автокопия от '+fmt(b.t)+' (кнопка «Восстановить из автокопии»)';
 }else await makeBackup();
 setInterval(makeBackup,180000);

const tt=setInterval(()=>{if(!$('app').hidden){clearInterval(tt);start()}},700);
})();

<script>

function fit(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
 for(const m of [1400,1100,850,650]){const k=Math.min(1,m/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
  const c=el('canvas',{width:w,height:h}),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  let s=c.toDataURL('image/png');if(s.length>850000)s=c.toDataURL('image/jpeg',.85);if(s.length<=850000)return res({src:s,w,h})}
 rej()};im.onerror=rej;im.src=src})}

// ---------- сбор новой домашки (полоса под доской) ----------
window.hwAdd=async(src,info)=>{if(!draft)return;try{const r=await fit(src);info=info||{};draft.tasks.push(Object.assign(r,{text:'',num:info.num||0,ans:info.ans||'',auto:!!info.ans}));tray(true)}catch(e){alert('Не получилось открыть картинку')}};
window.hwAddFile=f=>{if(/heic|heif/i.test(f.type+' '+(f.name||''))){alert('Фото в формате HEIC браузер не открывает. Сделайте скриншот или сохраните как JPG.');return}

  el('div',{className:'r'},

   el('button',{textContent:'📋 Вставить скриншот',onclick:pasteBtn}),
   el('button',{textContent:'🖼 Файл',onclick:()=>fileIn.click()}),fileIn,
   el('button',{textContent:'📄 PDF с ответами',title:'Домашка из PDF-файла: задачи нарежутся сами, ответы из конца файла подставятся для автопроверки',onclick:()=>pdfIn.click()}),pdfIn,
   el('button',{textContent:'✎ Текстом',onclick:()=>{draft.tasks.push({src:null,text:'',num:0,ans:''});tray(true);const a=$('hwcards').lastChild;if(a)a.querySelector('textarea').focus()}}),
   el('span',{className:'hint',textContent:'Скриншот задачи с сайта: сделайте снимок экрана и нажмите ⌘V (Ctrl+V) здесь. Если у задачи короткий ответ — впишите его, он проверится сам.'})));

  cs.append(c)});

async function pasteBtn(){
 try{const it=await navigator.clipboard.read();for(const x of it){const ty=x.types.find(v=>/^image\//.test(v));if(ty){window.hwAddFile(await x.getType(ty));return}}
  alert('В буфере обмена нет картинки. Сделайте скриншот задачи (на Mac: ⌘⇧4 с Ctrl — сразу в буфер) и нажмите снова.')}
 catch(e){alert('Нажмите ⌘V (на Windows — Ctrl+V), пока открыта эта полоса.')}

// ---------- домашка из PDF: задачи нарезаются по «№1», «№2»…, ответы берутся со страницы «Ответы» в конце ----------
let pdfLibP=null;
const pdfLib=()=>pdfLibP||(pdfLibP=import('/pdfjs/pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc='/pdfjs/pdf.worker.min.mjs';return m}));
const cleanAns=a=>String(a).replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[.;]+$/,'');
async function cropPdf(doc,p,yTop,yBot){ // область страницы по высоте (в координатах PDF, снизу вверх) → картинка, пустые поля сверху и снизу обрезаются
 const pg=await doc.getPage(p),base=pg.getViewport({scale:1}),sc=Math.min(2.2,1100/base.width),vp=pg.getViewport({scale:sc});
 const full=el('canvas',{width:Math.round(vp.width),height:Math.round(vp.height)}),fx=full.getContext('2d',{willReadFrequently:true});
 fx.fillStyle='#fff';fx.fillRect(0,0,full.width,full.height);await pg.render({canvasContext:fx,viewport:vp,intent:'print'}).promise; // «print» — рисуется и в фоновой вкладке
 const x0=Math.round(full.width*.05),w=Math.round(full.width*.9);
 let y0=Math.max(0,Math.round((base.height-yTop)*sc)-8),y1=Math.min(full.height,Math.round((base.height-yBot)*sc));
 const d=fx.getImageData(x0,0,w,full.height).data,blank=y=>{for(let x=0;x<w;x+=2){const i=(y*w+x)*4;if(d[i]<235||d[i+1]<235||d[i+2]<235)return false}return true};
 while(y1>y0+20&&blank(y1-1))y1--;while(y0<y1-20&&blank(y0))y0++;
 y0=Math.max(0,y0-10);y1=Math.min(full.height,y1+12);
 const c=el('canvas',{width:w,height:y1-y0});c.getContext('2d').drawImage(full,x0,y0,w,y1-y0,0,0,w,y1-y0);
 let src=c.toDataURL('image/png');if(src.length>800000)src=c.toDataURL('image/jpeg',.88);return src;
}
async function importPdf(file){
 if(!draft)return;const say=m=>{const t=document.querySelector('#hwtray .hint');if(t)t.textContent=m};
 try{
  say('Читаю PDF…');const lib=await pdfLib(),doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,n=doc.numPages;
  const items={};for(let p=1;p<=n;p++)items[p]=(await (await doc.getPage(p)).getTextContent()).items;
  // страницы с ответами: с той, где заголовок «Ответы», до конца (только во второй половине файла)
  let ansFrom=0;for(let p=n;p>Math.max(1,n/2);p--)if(items[p].some(i=>/^\s*Ответы\s*:?\s*$/i.test(i.str)||/^\s*Ответы\s*:/i.test(i.str)))ansFrom=p;
  const ans={};
  if(ansFrom){let txt='';for(let p=ansFrom;p<=n;p++){const pg=await doc.getPage(p),h=pg.getViewport({scale:1}).height;txt+=' '+items[p].filter(i=>i.transform[5]>45&&i.transform[5]<h-45).map(i=>i.str).join(' ')} // без колонтитулов (номер страницы)txt=txt.replace(/^[\s\S]*?Ответы\s*:?/i,' ');
   let m,re=/№\s*(\d+)\s*[.)]\s*([\s\S]+?)(?=\s№\s*\d+\s*[.)]|$)/g;while((m=re.exec(txt)))ans[+m[1]]=cleanAns(m[2]);
   if(!Object.keys(ans).length){re=/(?:^|\s)(\d+)\s*[.)]\s*(-?\s*[\d\s]+(?:[.,]\s*\d+)?)/g;while((m=re.exec(txt)))ans[+m[1]]=cleanAns(m[2])}}
  const last=ansFrom?ansFrom-1:n;
  // начала задач: метки task::N, иначе надписи «№N.» в тексте
  const starts=[];
  for(let k=1;k<=200;k++){let de=null;try{de=await doc.getDestination('task::'+k)}catch(e){}if(!Array.isArray(de))break;const p=(await doc.getPageIndex(de[0]))+1;if(p>last)break;starts.push({k,p,y:+de[3]||0})}
  if(!starts.length)for(let p=1;p<=last;p++)items[p].forEach(i=>{const m=i.str.match(/^\s*№\s*(\d+)\s*\.?\s*$/);if(m&&i.transform[4]<150)starts.push({k:+m[1],p,y:i.transform[5]+16})});
  let added=0,withAns=0;
  if(starts.length){
   for(let i=0;i<starts.length;i++){const s=starts[i],nx=starts[i+1],bot=nx&&nx.p===s.p?nx.y+4:30;
    say('Нарезаю задачу '+(i+1)+' из '+starts.length+'…');
    const src=await cropPdf(doc,s.p,s.y+4,bot),a=ans[s.k]&&/^-?\d+([.,]\d+)?$/.test(ans[s.k])?ans[s.k]:'';
    await window.hwAdd(src,{ans:a});if(a)withAns++;added++}
  }else{ // разметки нет — задания постранично
   for(let p=1;p<=last;p++){say('Страница '+p+' из '+last+'…');const pg=await doc.getPage(p),h=pg.getViewport({scale:1}).height;await window.hwAdd(await cropPdf(doc,p,h-20,20),{});added++}
  }
  tray(true);
  alert('Из PDF добавлено задач: '+added+'.'+(withAns?' Ответы для автопроверки найдены у '+withAns+'.':ansFrom?' Страницу с ответами нашёл, но разобрать ответы не получилось — впишите их вручную.':' Страницы «Ответы» в конце файла нет — впишите ответы вручную, если нужна автопроверка.')+' Проверьте ответы под задачами перед отправкой.');
 }catch(e){alert('Не получилось прочитать PDF: '+(e.message||e));tray()}
}
async function sendDraft(){
 const d=draft;if(!d||!d.tasks.length)return;
 if(d.tasks.some(k=>!k.src&&!k.text.trim())){alert('Есть пустая задача без условия — заполните или уберите её');return}
 const due=d.due?new Date(d.due+'T23:59').getTime():0;
 const r=await api('/api/admin/hw',{method:'POST',body:JSON.stringify({t:'add',s:d.sid,title:d.title.trim()||new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'}),due,tasks:d.tasks.map(k=>({img:k.src,w:k.w,h:k.h,text:k.text,num:k.num,ans:k.ans}))})});
 const j=r.ok?await r.json():{error:'Не получилось отправить (слишком большие картинки?)'};
 if(j.error){alert(j.error);return}
 stopDraft();alert('Домашка отправлена! Ученик увидит её в своём кабинете: кнопка «📚 Домашка» на его доске.');
}

async function openList(d,sid){

 {const tr=el('div',{className:'row'});d.b.append(tr);if(window.hwTgRow)window.hwTgRow(tr,sid)}

async function openOne(d,sid,id){

   if(h.auto[t.id]!==undefined)r.append(el('span',{className:h.auto[t.id]?'ok':'no',textContent:h.auto[t.id]?'✓ автопроверка':'✗ автопроверка'}))}
  else r.append(el('span',{className:'mut',textContent:'Развёрнутое решение — смотрите доску или фото'}));
  const y=el('button',{className:'mk2 y',textContent:'✓ Верно'}),n=el('button',{className:'mk2 n',textContent:'✗ Неверно'});
  const upd=()=>{y.classList.toggle('on',marks[t.id]===1);n.classList.toggle('on',marks[t.id]===0)};
  y.onclick=()=>{marks[t.id]=marks[t.id]===1?undefined:1;upd()};n.onclick=()=>{marks[t.id]=marks[t.id]===0?undefined:0;upd()};upd();
  r.append(el('span',{style:'margin-left:auto'}),y,n);c.append(r);d.b.append(c);
 });
 d.b.append(el('b',{textContent:'Решение ученика'}));
 const sol=el('div',{className:'r',style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center'});

 if(h.photos.length){const ph=el('div',{className:'phs'});h.photos.forEach(p=>{const im=el('img',{src:imgU(sid,p)});im.onclick=()=>window.open(im.src);ph.append(im)});d.b.append(ph)}
 const cm=el('textarea',{value:h.comment||'',placeholder:'Комментарий ученику (необязательно)'});d.b.append(cm);
 const pack=()=>{const m={};for(const k in marks)if(marks[k]===0||marks[k]===1)m[k]=marks[k];return m};
 d.b.append(el('div',{className:'row'},
  el('button',{className:'pri',textContent:h.st==='checked'?'Сохранить оценки':'Проверено ✓',onclick:async()=>{if(await post({t:'check',s:sid,id,marks:pack(),comment:cm.value}))openList(d,sid)}}),
  h.st!=='new'?el('button',{textContent:'Вернуть на доработку',title:'Ученик сможет исправить ответы и сдать снова',onclick:async()=>{if(await post({t:'return',s:sid,id,comment:cm.value}))openList(d,sid)}}):null,
  el('button',{textContent:'Закрыть',onclick:d.close})));
}
$('hwk').onclick=()=>{const sid=C().cur();if(!sid){alert('Сначала выберите ученика слева');return}const d=dlg();d.b.append(el('p',{className:'mut',textContent:'Загружаю…'}));openList(d,sid)};
})();

<script>
