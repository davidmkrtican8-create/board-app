<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Общая доска</title>
<style>
:root{--bg:#f4f1fa;--panel:#fff;--tx:#201c2b;--mut:#6b6580;--ac:#6a3fc4;--bd:#ddd6ee}
@media (prefers-color-scheme:dark){:root{--bg:#17141f;--panel:#221e2e;--tx:#ece8f5;--mut:#9a93b0;--ac:#a98bf0;--bd:#3a3450}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex}
#side{width:200px;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:10px;gap:6px;overflow:auto}
#who{font-weight:700;padding:4px 6px}
.pg{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.on{background:color-mix(in srgb,var(--ac) 16%,transparent);border-color:var(--ac)}
button,select,input{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
#main{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px;gap:8px}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#title{flex:1;min-width:140px;font-weight:600}
.sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--bd)}.sw.on{outline:2px solid var(--ac)}
#wrap{flex:1;min-height:0;position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:10px;background:#fff}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#st{font-size:12px;color:var(--mut)}
body.noside #side{display:none}
#edone{position:absolute;z-index:2;background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 2px 10px rgba(0,0,0,.3)}
#newt{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:2}
@media (max-width:640px){body{flex-direction:column}#side{width:100%;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--bd);padding:6px}#pl{display:flex;gap:6px}.pg{flex:none}}
</style>
</head>
<body>
<div id="side"><div id="who"></div><div id="pl"></div><button id="add">+ Доска</button><button id="cp">Копировать ссылку</button></div>
<div id="main">
 <div id="bar">
  <button id="hp" title="Скрыть или показать список досок">◧</button>
  <input id="title" placeholder="Название доски">
  <select id="tool">
   <option value="pen">Перо</option><option value="line">Линия</option><option value="arrow">Стрелка</option>
   <option value="rect">Прямоугольник</option><option value="ellipse">Эллипс / круг</option>
   <option value="er">Ластик</option><option value="mv">Двигать картинку</option><option value="hand">Рука (двигать доску)</option>
  </select>
  <span id="cols"></span>
  <select id="wd"><option value="3">Тонко</option><option value="5" selected>Средне</option><option value="10">Толсто</option></select>
  <select id="bgs"><option value="grid">Клетка</option><option value="line">Линейка</option><option value="none">Чистый</option></select>
  <button id="zo" title="Уменьшить">−</button><button id="zi" title="Увеличить">+</button><button id="fit">Показать всё</button><button id="fs2" title="Во весь экран">⛶</button>
  <label style="font-size:13px;white-space:nowrap"><input type="checkbox" id="snap" checked style="padding:0"> Ровные фигуры</label>
  <button id="undo">Отменить</button>
  
  <button id="img">Картинка</button><input type="file" id="fi" accept="image/*" hidden>
  <button id="clr">Очистить</button>
  <span id="st">Подключение…</span>
 </div>
 <div id="wrap"><canvas id="cv"></canvas><button id="newt" hidden>↓ Новая задача</button><button id="edone" hidden title="Закончить правку (или Enter)">✓ Готово</button></div>
</div>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
const room=location.pathname.split('/')[2],me='c'+Math.random().toString(36).slice(2,10).padEnd(8,'0');
let pages=[],strokes={},images={},page=null,live={},color='#1a1a1a',bg='grid',cur=null,lastEmit=0,mine=[],redo=[];
let cw=1,ch=1,dpr=1,view={x:0,y:0,s:1},gest=null,pan=null,space=false,holdT=0,holdA=null,lastP=[0,0],editImg=null,editStroke=null,jump=null;
const views={},imgEl={},ptrs=new Map();
const $=i=>document.getElementById(i),tool=()=>$('tool').value;
const send=op=>{op.from=me;return fetch('/api/'+room+'/op',{method:'POST',body:JSON.stringify(op)}).catch(()=>{$('st').textContent='Нет связи с сервером'})};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r2=v=>Math.round(v*100)/100;
const defView=()=>({x:0,y:0,s:Math.max(.05,Math.min(1,cw/1600))});
const clearLive=()=>send({t:'live',page:page,k:'pen',c:'#000000',w:1,pts:[]});

function resize(){
 dpr=window.devicePixelRatio||1;cw=Math.max(1,wrap.clientWidth);ch=Math.max(1,wrap.clientHeight);
 cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);redraw();
}
// Рисование: сглаженные кривые через середины отрезков, холст в физических пикселях экрана
function drawStroke(s){
 const p=s.pts,k=s.k||'pen';if(!p||p.length<2)return;
 ctx.strokeStyle=s.c;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
 if(k==='pen'){
  const n=p.length/2;ctx.moveTo(p[0],p[1]);
  if(n===1)ctx.lineTo(p[0]+.01,p[1]);
  else if(n===2)ctx.lineTo(p[2],p[3]);
  else{for(let i=1;i<n-1;i++)ctx.quadraticCurveTo(p[2*i],p[2*i+1],(p[2*i]+p[2*i+2])/2,(p[2*i+1]+p[2*i+3])/2);ctx.lineTo(p[2*n-2],p[2*n-1])}
 }else if(k==='poly'){ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.closePath()
 }else if(p.length>=4){
  const x0=p[0],y0=p[1],x1=p[2],y1=p[3];
  if(k==='line'||k==='arrow'){
   ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);
   if(k==='arrow'){const a=Math.atan2(y1-y0,x1-x0),L=s.w*5.5;
    ctx.moveTo(x1,y1);ctx.lineTo(x1-L*Math.cos(a-.4),y1-L*Math.sin(a-.4));
    ctx.moveTo(x1,y1);ctx.lineTo(x1-L*Math.cos(a+.4),y1-L*Math.sin(a+.4))}
  }else if(k==='rect')ctx.rect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0));
  else ctx.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2+.01,Math.abs(y1-y0)/2+.01,0,0,6.2832);
 }
 ctx.stroke();
}
function samples(s){ // контур фигуры точками (для ластика и «Показать всё»)
 const p=s.pts,k=s.k||'pen';if(k==='pen'||p.length<4)return p;
 const x0=p[0],y0=p[1],x1=p[2],y1=p[3],o=[];
 const seg=(ax,ay,bx,by)=>{for(let i=0;i<=12;i++){const t=i/12;o.push(ax+(bx-ax)*t,ay+(by-ay)*t)}};
 if(k==='poly'){for(let i=0;i<p.length;i+=2){const j=(i+2)%p.length;seg(p[i],p[i+1],p[j],p[j+1])}}
 else if(k==='line'||k==='arrow')seg(x0,y0,x1,y1);
 else if(k==='rect'){seg(x0,y0,x1,y0);seg(x1,y0,x1,y1);seg(x1,y1,x0,y1);seg(x0,y1,x0,y0)}
 else for(let i=0;i<=48;i++){const t=i/48*6.2832;o.push((x0+x1)/2+Math.cos(t)*(x1-x0)/2,(y0+y1)/2+Math.sin(t)*(y1-y0)/2)}
 return o;
}
function getImg(id,src){
 if(!imgEl[id]||imgEl[id].s!==src){const e=new Image();e.onload=redraw;e.src=src;imgEl[id]={e:e,s:src}}
 return imgEl[id].e;
}
// ручки на картинке: левый верхний угол — переместить, правый нижний — изменить размер (работают в любом инструменте)
const handlesOn=id=>tool()==='mv'||id===editImg;
function drawHandles(g){
 const s=view.s,z=26/s,a=z*.28;
 ctx.save();ctx.strokeStyle='rgba(106,63,196,.9)';ctx.lineWidth=2/s;ctx.strokeRect(g.x,g.y,g.w,g.h);
 ctx.fillStyle='rgba(106,63,196,.92)';ctx.fillRect(g.x,g.y,z,z);ctx.fillRect(g.x+g.w-z,g.y+g.h-z,z,z);
 ctx.strokeStyle='#fff';ctx.lineWidth=2/s;ctx.lineCap='round';ctx.beginPath();
 const cx=g.x+z/2,cy=g.y+z/2,bx=g.x+g.w-z/2,by=g.y+g.h-z/2;
 ctx.moveTo(cx-a,cy);ctx.lineTo(cx+a,cy);ctx.moveTo(cx,cy-a);ctx.lineTo(cx,cy+a);
 ctx.moveTo(bx-a,by+a);ctx.lineTo(bx+a,by-a);
 ctx.stroke();ctx.restore();
}
function handleAt(x,y){
 const ims=images[page]||{},z=26/view.s;let f=null;
 for(const id in ims){if(!handlesOn(id))continue;const g=ims[id];
  if(x>=g.x&&x<=g.x+z&&y>=g.y&&y<=g.y+z)f={id:id,type:'move'};
  else if(x>=g.x+g.w-z&&x<=g.x+g.w&&y>=g.y+g.h-z&&y<=g.y+g.h)f={id:id,type:'size'}}
 return f;
}
function notifyNew(g){ // у ученика: новая картинка/задача появилась вне экрана
 const vis=g.x<view.x+cw/view.s&&g.x+g.w>view.x&&g.y<view.y+ch/view.s&&g.y+g.h>view.y;
 if(vis)return;jump=g;$('newt').hidden=false;
}
function strokeBox(sk){
 const q=samples(sk);let a=1e12,b=1e12,c=-1e12,d=-1e12;
 for(let i=0;i<q.length;i+=2){a=Math.min(a,q[i]);c=Math.max(c,q[i]);b=Math.min(b,q[i+1]);d=Math.max(d,q[i+1])}
 const pd=10/view.s;return[a-pd,b-pd,c+pd,d+pd];
}
function placeDone(){ // кнопка «Готово» рядом с редактируемой картинкой или фигурой
 const b=$('edone'),g=editImg&&(images[page]||{})[editImg];let rc=null;
 if(g)rc=[g.x,g.y,g.x+g.w,g.y+g.h];
 else{const sk=editStroke&&(strokes[page]||{})[editStroke];if(sk)rc=strokeBox(sk)}
 if(!rc){b.hidden=true;return}
 b.hidden=false;const s=view.s;
 let x=(rc[2]-view.x)*s-b.offsetWidth,y=(rc[3]-view.y)*s+8;
 x=Math.max(6,Math.min(cw-b.offsetWidth-6,x));y=Math.max(6,Math.min(ch-b.offsetHeight-6,y));
 b.style.left=x+'px';b.style.top=y+'px';
}
function grid(){
 const s=view.s,x0=view.x,y0=view.y,x1=x0+cw/s,y1=y0+ch/s;
 ctx.lineWidth=1/s;ctx.strokeStyle='#dfe6f2';ctx.beginPath();
 if(bg==='grid'){let st=40;while(st*s<14)st*=5;
  for(let x=Math.floor(x0/st)*st;x<=x1;x+=st){ctx.moveTo(x,y0);ctx.lineTo(x,y1)}
  for(let y=Math.floor(y0/st)*st;y<=y1;y+=st){ctx.moveTo(x0,y);ctx.lineTo(x1,y)}}
 if(bg==='line'){let st=50;while(st*s<14)st*=5;
  for(let y=Math.floor(y0/st)*st;y<=y1;y+=st){ctx.moveTo(x0,y);ctx.lineTo(x1,y)}}
 ctx.stroke();
}
function redraw(){
 const s=view.s;
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(dpr*s,0,0,dpr*s,-view.x*s*dpr,-view.y*s*dpr);
 ctx.imageSmoothingQuality='high';
 grid();
 const ims=images[page]||{};
 for(const id in ims){const g=ims[id],e=getImg(id,g.src);if(e.complete&&e.naturalWidth)ctx.drawImage(e,g.x,g.y,g.w,g.h)}
 const ps=strokes[page]||{};for(const id in ps)drawStroke(ps[id]);
 for(const k in live)if(live[k].page===page)drawStroke(live[k]);
 if(cur&&cur.pts)drawStroke(cur);
 for(const id in ims)if(handlesOn(id))drawHandles(ims[id]);
 if(editStroke&&strokes[page]&&strokes[page][editStroke]){ // рамка вокруг только что нарисованной ровной фигуры
  const bb=strokeBox(strokes[page][editStroke]);ctx.save();ctx.strokeStyle='rgba(106,63,196,.9)';ctx.lineWidth=2/s;ctx.setLineDash([8/s,6/s]);
  ctx.strokeRect(bb[0],bb[1],bb[2]-bb[0],bb[3]-bb[1]);ctx.restore()}
 placeDone();
}
function renderPages(){const b=$('pl');b.innerHTML='';
 pages.forEach(p=>{const d=document.createElement('div');d.className='pg'+(p.id===page?' on':'');
  d.textContent=p.title||'Без названия';d.onclick=()=>openPage(p.id);b.appendChild(d)})}
function openPage(id){page=id;live={};$('newt').hidden=true;jump=null;editImg=null;editStroke=null;view=views[id]||(views[id]=defView());renderPages();redraw();
 const p=pages.filter(x=>x.id===id)[0];$('title').value=p?p.title:''}

function onOp(o){
 if(o.t==='init'){$('who').textContent=o.name?'Кабинет: '+o.name:'Доска';document.title=o.name||'Доска';pages=o.s.pages;strokes=o.s.strokes;images=o.s.images||{};if(!page||!pages.some(p=>p.id===page))page=pages[0].id;openPage(page);return}
 if(o.t==='peers'){$('st').textContent='Онлайн: '+o.n;return}
 if(o.t==='live'){if(o.from!==me){live[o.from]={page:o.page,k:o.k,c:o.c,w:o.w,pts:o.pts};redraw()}return}
 if(o.t==='stroke'){(strokes[o.page]=strokes[o.page]||{})[o.stroke.id]=o.stroke;delete live[o.from]}
 if(o.t==='strokeset'&&strokes[o.page]&&strokes[o.page][o.id])strokes[o.page][o.id].pts=o.pts;
 if(o.t==='image'){(images[o.page]=images[o.page]||{})[o.img.id]=o.img;if(o.from!==me&&o.page===page)notifyNew(o.img)}
 if(o.t==='imgset'&&images[o.page]&&images[o.page][o.id]){const g=images[o.page][o.id];g.x=o.x;g.y=o.y;g.w=o.w;g.h=o.h}
 if(o.t==='erase'){if(strokes[o.page])delete strokes[o.page][o.id];if(images[o.page])delete images[o.page][o.id]}
 if(o.t==='clear'){strokes[o.page]={};images[o.page]={}}
 if(o.t==='addPage'&&!pages.some(p=>p.id===o.id))pages.push({id:o.id,title:o.title});
 if(o.t==='title')pages.forEach(p=>{if(p.id===o.id)p.title=o.title});
 renderPages();redraw();
 if(o.t==='title'&&o.id===page&&document.activeElement!==$('title'))$('title').value=o.title;
}
const es=new EventSource('/api/'+room+'/events?c='+me);
es.onmessage=e=>onOp(JSON.parse(e.data));
es.onerror=()=>{$('st').textContent='Переподключение…'};

// --- камера: бесконечная доска ---
function zoomAt(px,py,f){
 const ns=Math.min(8,Math.max(.05,view.s*f)),wx=px/view.s+view.x,wy=py/view.s+view.y;
 view.s=ns;view.x=wx-px/ns;view.y=wy-py/ns;redraw();
}
function fit(){
 let a=1e12,b=1e12,c=-1e12,d=-1e12;
 const ps=strokes[page]||{};
 for(const id in ps){const p=samples(ps[id]);for(let i=0;i<p.length;i+=2){a=Math.min(a,p[i]);c=Math.max(c,p[i]);b=Math.min(b,p[i+1]);d=Math.max(d,p[i+1])}}
 const ims=images[page]||{};
 for(const id in ims){const g=ims[id];a=Math.min(a,g.x);b=Math.min(b,g.y);c=Math.max(c,g.x+g.w);d=Math.max(d,g.y+g.h)}
 if(a>c){view=views[page]=defView();redraw();return}
 const s=Math.min(2,Math.max(.05,Math.min(cw/(c-a+120),ch/(d-b+120))));
 view=views[page]={s:s,x:(a+c)/2-cw/s/2,y:(b+d)/2-ch/s/2};redraw();
}
function beginGesture(){
 const a=[...ptrs.values()],r=cv.getBoundingClientRect(),mx=(a[0].x+a[1].x)/2-r.left,my=(a[0].y+a[1].y)/2-r.top;
 gest={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,s:view.s,wx:mx/view.s+view.x,wy:my/view.s+view.y};
}
function doGesture(){
 const a=[...ptrs.values()],r=cv.getBoundingClientRect(),mx=(a[0].x+a[1].x)/2-r.left,my=(a[0].y+a[1].y)/2-r.top,d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
 const ns=Math.min(8,Math.max(.05,gest.s*d/gest.d));view.s=ns;view.x=gest.wx-mx/ns;view.y=gest.wy-my/ns;redraw();
}
cv.addEventListener('wheel',e=>{
 e.preventDefault();const r=cv.getBoundingClientRect();
 if(e.ctrlKey||e.metaKey)zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.01));
 else{view.x+=e.deltaX/view.s;view.y+=e.deltaY/view.s;redraw()}
},{passive:false});
if(!('ontouchstart' in window)){ // щипок на трекпаде Safari
 let gs=1;
 cv.addEventListener('gesturestart',e=>{e.preventDefault();gs=1});
 cv.addEventListener('gesturechange',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.scale/gs);gs=e.scale});
}

// --- ввод ---
const pos=e=>{const r=cv.getBoundingClientRect();return[r2((e.clientX-r.left)/view.s+view.x),r2((e.clientY-r.top)/view.s+view.y)]};
// --- «ровные фигуры»: удержите перо на секунду в конце линии ---
function segDist(q,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((q[0]-a[0])*dx+(q[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(a[0]+t*dx-q[0],a[1]+t*dy-q[1])}
function rdp(p,eps){
 if(p.length<3)return p.slice();
 let dm=0,im=0;const a=p[0],b=p[p.length-1];
 for(let i=1;i<p.length-1;i++){const d=segDist(p[i],a,b);if(d>dm){dm=d;im=i}}
 if(dm>eps)return rdp(p.slice(0,im+1),eps).slice(0,-1).concat(rdp(p.slice(im),eps));
 return [a,b];
}
function ellipseFit(P,a,b,c,d,tol){
 const cx=(a+c)/2,cy=(b+d)/2,rx=(c-a)/2,ry=(d-b)/2;if(rx<1||ry<1)return null;
 const r=P.map(q=>Math.hypot((q[0]-cx)/rx,(q[1]-cy)/ry)),m=r.reduce((s,v)=>s+v,0)/r.length;
 const sd=Math.sqrt(r.reduce((s,v)=>s+(v-m)*(v-m),0)/r.length);
 if(m<.8||m>1.25||sd/m>tol)return null;
 if(Math.abs(rx-ry)<.15*Math.max(rx,ry)){const R=(rx+ry)/2;return{k:'ellipse',pts:[cx-R,cy-R,cx+R,cy+R]}}
 return{k:'ellipse',pts:[a,b,c,d]};
}
function recognize(flat){
 const P=[];for(let i=0;i<flat.length;i+=2)P.push([flat[i],flat[i+1]]);
 if(P.length<8)return null;
 let L=0,a=1e12,b=1e12,c=-1e12,d=-1e12;
 P.forEach((q,i)=>{if(i)L+=Math.hypot(q[0]-P[i-1][0],q[1]-P[i-1][1]);a=Math.min(a,q[0]);c=Math.max(c,q[0]);b=Math.min(b,q[1]);d=Math.max(d,q[1])});
 const D=Math.hypot(c-a,d-b);if(D<16/view.s)return null;
 const f=P[0],l=P[P.length-1],gap=Math.hypot(l[0]-f[0],l[1]-f[1]);
 if(gap>.5*D){
  let dev=0;P.forEach(q=>{dev=Math.max(dev,segDist(q,f,l))});
  if(dev>.07*gap||L>1.25*gap)return null;
  let x0=f[0],y0=f[1],x1=l[0],y1=l[1];
  if(Math.abs(y1-y0)<.07*gap){y0=y1=(y0+y1)/2}else if(Math.abs(x1-x0)<.07*gap){x0=x1=(x0+x1)/2}
  return{k:'line',pts:[x0,y0,x1,y1]};
 }
 if(gap>.3*L)return null;
 const strict=ellipseFit(P,a,b,c,d,.07);if(strict)return strict;
 const v=rdp(P,.05*D);
 if(Math.hypot(v[v.length-1][0]-v[0][0],v[v.length-1][1]-v[0][1])<.1*D)v.pop();
 for(let ch=true;ch&&v.length>3;){ch=false;
  for(let i=0;i<v.length;i++){
   const p0=v[(i+v.length-1)%v.length],p1=v[i],p2=v[(i+1)%v.length];
   let da=Math.abs(Math.atan2(p2[1]-p1[1],p2[0]-p1[0])-Math.atan2(p1[1]-p0[1],p1[0]-p0[0]));if(da>Math.PI)da=2*Math.PI-da;
   if(da<.35){v.splice(i,1);ch=true;break}}}
 if(v.length===3)return{k:'poly',pts:v.flat()};
 if(v.length===4){
  let ax=true;
  for(let i=0;i<4;i++){const p1=v[i],p2=v[(i+1)%4],m=Math.abs(Math.atan2(p2[1]-p1[1],p2[0]-p1[0]))%(Math.PI/2);if(Math.min(m,Math.PI/2-m)>.26)ax=false}
  if(ax){const xs=v.map(q=>q[0]),ys=v.map(q=>q[1]);return{k:'rect',pts:[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}}
  return{k:'poly',pts:v.flat()};
 }
 return ellipseFit(P,a,b,c,d,.11);
}
function adjust(p){ // после привязки фигуру можно тянуть: размер подгоняется движением пера
 const b=cur.base,q=b.pts,k=b.k;
 if(k==='line'||k==='arrow'){
  const x0=q[0],y0=q[1];let x1=p[0],y1=p[1];const len=Math.hypot(x1-x0,y1-y0);
  if(len>0){if(Math.abs(y1-y0)<.05*len)y1=y0;else if(Math.abs(x1-x0)<.05*len)x1=x0}
  cur.pts=[x0,y0,x1,y1].map(r2);
 }else if(k==='ellipse'||k==='rect'){
  const cx=(q[0]+q[2])/2,cy=(q[1]+q[3])/2,rx=(q[2]-q[0])/2,ry=(q[3]-q[1])/2;
  const ax=b.p[0]-cx,ay=b.p[1]-cy,f=Math.hypot(p[0]-cx,p[1]-cy)/(Math.hypot(ax,ay)||1);
  const sx=Math.abs(ax)>.3*rx?(p[0]-cx)/ax:f,sy=Math.abs(ay)>.3*ry?(p[1]-cy)/ay:f;
  let nx=rx*Math.max(.05,sx),ny=ry*Math.max(.05,sy);
  if(Math.abs(nx-ny)<.08*Math.max(nx,ny))nx=ny=(nx+ny)/2; // «магнит»: круг и квадрат
  cur.pts=[cx-nx,cy-ny,cx+nx,cy+ny].map(r2);
 }else{
  let cx=0,cy=0;const n=q.length/2;for(let i=0;i<q.length;i+=2){cx+=q[i];cy+=q[i+1]}cx/=n;cy/=n;
  const f=Math.max(.05,Math.hypot(p[0]-cx,p[1]-cy)/(Math.hypot(b.p[0]-cx,b.p[1]-cy)||1));
  cur.pts=q.map((v,i)=>r2((i%2?cy:cx)+(v-(i%2?cy:cx))*f));
 }
 redraw();const t=Date.now();
 if(t-lastEmit>80){lastEmit=t;send({t:'live',page:page,k:cur.k,c:cur.c,w:cur.w,pts:cur.pts})}
}
function snapNow(){
 if(!cur||cur.k!=='pen'||cur.erasing||cur.mv)return;
 const r=recognize(cur.pts);if(!r)return;
 cur.k=r.k;cur.pts=r.pts.map(r2);cur.snapped=true;cur.base={k:cur.k,pts:cur.pts.slice(),p:lastP.slice()};redraw();
 send({t:'live',page:page,k:cur.k,c:cur.c,w:cur.w,pts:cur.pts});
}
function near(p,x,y,rad){
 if(p.length===2)return Math.hypot(p[0]-x,p[1]-y)<rad;
 for(let i=0;i<p.length-2;i+=2){
  const ax=p[i],ay=p[i+1],dx=p[i+2]-ax,dy=p[i+3]-ay,l=dx*dx+dy*dy;
  let t=l?((x-ax)*dx+(y-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));
  if(Math.hypot(ax+t*dx-x,ay+t*dy-y)<rad)return true}
 return false;
}
function eraseAt(x,y){
 const rad=16/view.s,ps=strokes[page]||{};let hit=false;
 for(const id in ps)if(near(samples(ps[id]),x,y,rad)){delete ps[id];send({t:'erase',page:page,id:id});hit=true}
 if(!hit){const ims=images[page]||{};
  for(const id in ims){const g=ims[id];if(x>=g.x&&x<=g.x+g.w&&y>=g.y&&y<=g.y+g.h){delete ims[id];send({t:'erase',page:page,id:id});break}}}
 redraw();
}
function imgAt(x,y){const ims=images[page]||{};let f=null;
 for(const id in ims){const g=ims[id];if(x>=g.x&&x<=g.x+g.w&&y>=g.y&&y<=g.y+g.h)f=id}return f}

cv.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(e.pointerType==='mouse'&&e.button===2)return;
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 if(e.pointerType==='touch'){
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){clearTimeout(holdT);if(cur&&cur.pts)clearLive();cur=null;pan=null;beginGesture();return}
  if(ptrs.size>2)return;
 }
 if(!page)return;
 const t=tool();
 if(e.button===1||space||t==='hand'){pan={id:e.pointerId,x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};cv.style.cursor='grabbing';return}
 const p=pos(e);lastP=p;
 if(e.altKey&&t!=='er'){const ia=imgAt(p[0],p[1]);if(ia){editImg=ia;redraw();return}} // Alt+клик по картинке — править её
 if(editStroke){ // сразу после «ровной фигуры»: можно перенести её, клик в стороне — выход
  const sk=(strokes[page]||{})[editStroke];
  if(!sk||t==='er'){editStroke=null;redraw()}
  else{const bb=strokeBox(sk);
   if(p[0]>=bb[0]&&p[0]<=bb[2]&&p[1]>=bb[1]&&p[1]<=bb[3]){cur={mvs:editStroke,sx:p[0],sy:p[1],orig:sk.pts.slice()};return}
   editStroke=null;redraw();}
 }
 if(editImg){ // режим правки: тянем картинку за любое место или за ручки; клик в стороне — выход
  const g=(images[page]||{})[editImg];
  if(!g||t==='er'){editImg=null;redraw()}
  else{
   const hh=handleAt(p[0],p[1]);
   if(hh){const g2=images[page][hh.id];cur={mv:hh.id,size:hh.type==='size',dx:p[0]-g2.x,dy:p[1]-g2.y,r:g2.h/g2.w};return}
   if(p[0]>=g.x&&p[0]<=g.x+g.w&&p[1]>=g.y&&p[1]<=g.y+g.h){cur={mv:editImg,size:false,dx:p[0]-g.x,dy:p[1]-g.y,r:g.h/g.w};return}
   editImg=null;redraw();
  }
 }
 if(t==='er'){cur={erasing:1};eraseAt(p[0],p[1]);return}
 if(t==='mv'){const id=imgAt(p[0],p[1]);if(!id)return;const g=images[page][id],hs=36/view.s;
  cur={mv:id,size:p[0]>g.x+g.w-hs&&p[1]>g.y+g.h-hs,dx:p[0]-g.x,dy:p[1]-g.y,r:g.h/g.w};return}
 const w=r2(+$('wd').value/view.s);
 cur=t==='pen'?{id:newId(),k:'pen',pts:[p[0],p[1]],c:color,w:w}
              :{id:newId(),k:t,pts:[p[0],p[1],p[0],p[1]],c:color,w:w};
 redraw();
});
cv.addEventListener('pointermove',e=>{
 if(e.pointerType==='touch'&&ptrs.has(e.pointerId)){
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gest&&ptrs.size>=2){doGesture();return}
 }
 if(pan&&pan.id===e.pointerId){view.x=pan.vx-(e.clientX-pan.x)/view.s;view.y=pan.vy-(e.clientY-pan.y)/view.s;redraw();return}
 if(!cur&&editStroke&&e.pointerType!=='touch'&&!space){
  const q=pos(e),sk=(strokes[page]||{})[editStroke];
  if(sk){const bb=strokeBox(sk);cv.style.cursor=(q[0]>=bb[0]&&q[0]<=bb[2]&&q[1]>=bb[1]&&q[1]<=bb[3])?'move':'crosshair'}
 }
 if(!cur&&editImg&&e.pointerType!=='touch'&&!space){ // только курсор, без подсветки
  const q=pos(e),h2=handleAt(q[0],q[1]),g=(images[page]||{})[editImg],ins=g&&q[0]>=g.x&&q[0]<=g.x+g.w&&q[1]>=g.y&&q[1]<=g.y+g.h;
  cv.style.cursor=h2?(h2.type==='move'?'move':'nwse-resize'):(ins?'move':(tool()==='hand'?'grab':'crosshair'));
 }
 if(!cur)return;
 if(cur.snapped){adjust(pos(e));return}
 const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];if(!evs.length)evs.push(e);
 if(cur.erasing){evs.forEach(v=>{const p=pos(v);eraseAt(p[0],p[1])});return}
 if(cur.mvs){const p=pos(e),sk=(strokes[page]||{})[cur.mvs];if(!sk)return;
  const dx=p[0]-cur.sx,dy=p[1]-cur.sy;sk.pts=cur.orig.map((v,i)=>r2(v+(i%2?dy:dx)));redraw();
  const t2=Date.now();if(t2-lastEmit>80){lastEmit=t2;send({t:'strokeset',page:page,id:cur.mvs,pts:sk.pts})}
  return}
 if(cur.mv){const p=pos(e),g=images[page][cur.mv];
  if(cur.size){g.w=Math.max(20/view.s,p[0]-g.x);g.h=g.w*cur.r}else{g.x=p[0]-cur.dx;g.y=p[1]-cur.dy}
  redraw();return}
 if(cur.k==='pen'){
  const min=1.5/view.s;
  evs.forEach(v=>{const p=pos(v),n=cur.pts.length;
   if(n<19000&&Math.hypot(p[0]-cur.pts[n-2],p[1]-cur.pts[n-1])>=min)cur.pts.push(p[0],p[1])});
 }else{const p=pos(e);cur.pts[2]=p[0];cur.pts[3]=p[1]}
 lastP=pos(e);
 if(cur.k==='pen'&&$('snap').checked){const ha=holdA;if(!ha||Math.hypot(e.clientX-ha[0],e.clientY-ha[1])>5){holdA=[e.clientX,e.clientY];clearTimeout(holdT);holdT=setTimeout(snapNow,650)}}
 redraw();const n=Date.now();
 if(n-lastEmit>80){lastEmit=n;send({t:'live',page:page,k:cur.k,c:cur.c,w:cur.w,pts:cur.pts})}
});
function end(e){
 if(e.pointerType==='touch'){ptrs.delete(e.pointerId);if(ptrs.size<2)gest=null}
 if(pan&&pan.id===e.pointerId){pan=null;cv.style.cursor=tool()==='hand'?'grab':'crosshair';return}
 clearTimeout(holdT);if(!cur)return;const s=cur;cur=null;if(s.erasing)return;
 if(s.mvs){const sk=(strokes[page]||{})[s.mvs];if(sk)send({t:'strokeset',page:page,id:s.mvs,pts:sk.pts});return}
 if(s.mv){const g=images[page][s.mv];send({t:'imgset',page:page,id:s.mv,x:r2(g.x),y:r2(g.y),w:r2(g.w),h:r2(g.h)});return}
 if(s.k==='pen'){const p=pos(e),n=s.pts.length;if(p[0]!==s.pts[n-2]||p[1]!==s.pts[n-1])s.pts.push(p[0],p[1])}
 else if(!s.snapped&&(Math.abs(s.pts[2]-s.pts[0])+Math.abs(s.pts[3]-s.pts[1]))*view.s<4){clearLive();redraw();return}
 (strokes[page]=strokes[page]||{})[s.id]={k:s.k,pts:s.pts,c:s.c,w:s.w};mine.push({page:page,id:s.id});redo=[];if(s.snapped)editStroke=s.id;redraw();
 send({t:'stroke',page:page,stroke:{id:s.id,k:s.k,pts:s.pts,c:s.c,w:s.w}});
}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
document.addEventListener('keydown',e=>{
 const a=document.activeElement,tg=a&&a.tagName;
 if(e.code==='Space'&&!(tg==='INPUT'||tg==='SELECT'||tg==='BUTTON')){space=true;cv.style.cursor='grab';e.preventDefault();return}
 if((editImg||editStroke)&&(e.key==='Enter'||e.key==='Escape')&&tg!=='INPUT'&&tg!=='SELECT'){editImg=null;editStroke=null;redraw();e.preventDefault();return}
 const z=e.code==='KeyZ',y=e.code==='KeyY';
 if(!(e.metaKey||e.ctrlKey)||!(z||y)||tg==='INPUT')return;
 e.preventDefault();(y||e.shiftKey)?redoAct():undo();
});
document.addEventListener('keyup',e=>{if(e.code==='Space'){space=false;cv.style.cursor=tool()==='hand'?'grab':'crosshair'}});

// --- картинки ---
function placeImage(im,task,gap){
 let src=null,w=0,h=0;
 for(const m of [1400,1000,700,500,350]){
  const sc=Math.min(1,m/Math.max(im.width,im.height));w=Math.round(im.width*sc);h=Math.round(im.height*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
  let s=c.toDataURL('image/png');if(s.length>800000)s=c.toDataURL('image/jpeg',.85);
  if(s.length<=800000){src=s;break}}
 if(!src){$('st').textContent='Картинка слишком большая';return}
 const sw=task?Math.min(w,.8*cw):Math.min(w,.6*cw,.6*ch*w/h),dw=sw/view.s,dh=dw*h/w,iid=newId();
 let x=view.x+cw/view.s/2-dw/2,y=view.y+ch/view.s/2-dh/2;
 if(task){ // задачи идут столбиком вниз: под последней картинкой и всем написанным, с местом под решение
  const ims=images[page]||{};let ib=-1e12,ix=null,cb=-1e12;
  for(const id in ims){const g=ims[id];if(g.y+g.h>ib){ib=g.y+g.h;ix=g.x}}
  cb=ib;const ps=strokes[page]||{};
  for(const id in ps){const q=samples(ps[id]);for(let i=1;i<q.length;i+=2)if(q[i]>cb)cb=q[i]}
  x=ix!==null?ix:view.x+(cw/view.s-dw)/2;
  y=cb>-1e11?Math.max(cb+50/view.s,ib+gap/view.s):view.y+30/view.s;
  if(y<view.y||y+dh>view.y+ch/view.s)view.y=y-.1*ch/view.s; // показать новую задачу
  if(x<view.x||x+dw>view.x+cw/view.s)view.x=x+dw/2-cw/view.s/2;
 }
 mine.push({page:page,id:iid});redo=[];
 send({t:'image',page:page,img:{id:iid,src:src,x:r2(x),y:r2(y),w:r2(dw),h:r2(dh)}});
 editImg=iid;redraw(); // сразу режим правки: можно подвинуть и изменить размер
}
function addImage(file){
 const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onload=()=>placeImage(im,false);im.src=fr.result};
 fr.readAsDataURL(file);
}
// задачи из сборников приходят из кабинета преподавателя
window.addEventListener('message',e=>{
 if(e.origin!==location.origin)return;const d=e.data;
 if(!d||d.t!=='task'||typeof d.src!=='string'||!/^data:image\/(png|jpeg);base64,/.test(d.src))return;
 const im=new Image();im.onload=()=>placeImage(im,true,Math.max(0,Math.min(1500,+d.gap||240)));im.src=d.src;
});
document.addEventListener('paste',e=>{
 const it=(e.clipboardData&&e.clipboardData.items)||[];
 for(let i=0;i<it.length;i++)if(it[i].type.indexOf('image')===0){addImage(it[i].getAsFile());e.preventDefault();return}
});
$('img').onclick=()=>$('fi').click();
$('fi').onchange=()=>{if($('fi').files[0])addImage($('fi').files[0]);$('fi').value=''};

// --- отмена / возврат ---
function undo(){
 const m=mine.pop();if(!m)return;const o=(strokes[m.page]||{})[m.id],g=(images[m.page]||{})[m.id];
 if(o){redo.push({page:m.page,id:m.id,stroke:o});delete strokes[m.page][m.id]}
 else if(g){redo.push({page:m.page,id:m.id,img:g});delete images[m.page][m.id]}else return;
 send({t:'erase',page:m.page,id:m.id});redraw();
}
function redoAct(){
 const r=redo.pop();if(!r)return;
 if(r.stroke){(strokes[r.page]=strokes[r.page]||{})[r.id]=r.stroke;send({t:'stroke',page:r.page,stroke:Object.assign({id:r.id},r.stroke)})}
 else{(images[r.page]=images[r.page]||{})[r.id]=r.img;send({t:'image',page:r.page,img:Object.assign({id:r.id},r.img)})}
 mine.push({page:r.page,id:r.id});redraw();
}

// --- интерфейс ---
$('add').onclick=()=>{const id='p'+newId(),d=new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});let t=d,n=2;while(pages.some(p=>p.title===t))t=d+' ('+(n++)+')';send({t:'addPage',id:id,title:t});openPage(id)};
$('title').onchange=()=>send({t:'title',id:page,title:$('title').value.trim()||'Без названия'});
$('tool').onchange=()=>{cv.style.cursor=tool()==='hand'?'grab':'crosshair';redraw()};
$('bgs').onchange=()=>{bg=$('bgs').value;redraw()};
$('undo').onclick=undo;
$('zi').onclick=()=>zoomAt(cw/2,ch/2,1.25);$('zo').onclick=()=>zoomAt(cw/2,ch/2,.8);$('fit').onclick=fit;
$('clr').onclick=()=>{if(confirm('Очистить доску для всех?')){strokes[page]={};images[page]={};redraw();send({t:'clear',page:page})}};
$('cp').onclick=()=>{const t=location.href;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$('cp').textContent='Скопировано'},()=>{prompt('Ссылка:',t)});setTimeout(()=>{$('cp').textContent='Копировать ссылку'},1500)};
['#1a1a1a','#d32f2f','#1565c0','#2e7d32','#ef6c00','#7b1fa2'].forEach((c,i)=>{
 const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=c;
 b.onclick=()=>{color=c;if(['er','mv','hand'].includes(tool()))$('tool').value='pen';document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on')};
 $('cols').appendChild(b)});
$('edone').onclick=()=>{editImg=null;editStroke=null;redraw()};
$('newt').onclick=()=>{if(!jump)return;view.y=jump.y-.1*ch/view.s;view.x=jump.x+jump.w/2-cw/view.s/2;$('newt').hidden=true;jump=null;redraw()};
function setSide(h){document.body.classList.toggle('noside',h);localStorage.setItem('noside',h?'1':'0')}
$('hp').onclick=()=>setSide(!document.body.classList.contains('noside'));
if(localStorage.getItem('noside')==='1')setSide(true);
const fe=document.documentElement,frq=fe.requestFullscreen||fe.webkitRequestFullscreen;
if(window.self!==window.top||!frq)$('fs2').hidden=true; // в кабинете преподавателя полный экран включается там
$('fs2').onclick=()=>{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else frq.call(fe)};
new ResizeObserver(resize).observe(wrap);
resize();
})();
